<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="pointer-events; pointer-events: none; touch-action">
<title>pointer-events--none</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.stage { position: relative; height: 96px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.btn { position: absolute; left: 12px; top: 28px; border-radius: 10px; padding: 8px 16px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.veil { position: absolute; inset: 0; border-radius: 12px; background: rgba(37, 99, 235, 0.15); pointer-events: none; display: flex; align-items: center; justify-content: flex-end; padding-right: 12px; color: var(--muted); font-size: 12px; }
.pan { touch-action: pan-x; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="veil"><p class="cap">overlay with pointer-events: none over a button (visual only)</p><div class="stage"><div class="btn">Tap me</div><div class="veil">pointer-events: none overlay</div></div></section>
<section class="v" id="pan"><p class="cap">touch-action: pan-x card (no visual effect)</p><div class="stage pan"></div></section>
</main>
</body>
</html>
