<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="cursor; user-select; will-change">
<title>cursor</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.b { border-radius: 8px; padding: 6px 12px; background: var(--soft); font-size: 13px; }
.pointer { cursor: pointer; }
.grab { cursor: grab; }
.nosel { user-select: none; }
.wc { will-change: transform; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="cursors"><p class="cap">cursor pointer / grab / user-select none / will-change — identical rendering</p><div class="row"><span class="b pointer">pointer</span><span class="b grab">grab</span><span class="b nosel">no select</span><span class="b wc">will-change</span></div></section>
</main>
</body>
</html>
