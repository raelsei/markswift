<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-themes" content="light,dark">
<title>pointer-events</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.stage { position: relative; padding: 16px; background: var(--card); border-radius: 12px; }
.btn { border: 0; font: inherit; border-radius: 10px; padding: 8px 16px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.veil { position: absolute; inset: 0; border-radius: 12px; background: rgba(37, 99, 235, 0.15); pointer-events: none; }
.toasts { position: absolute; inset: 0; display: flex; justify-content: flex-end; align-items: center; padding: 0 16px; pointer-events: none; }
.toast { pointer-events: auto; background: var(--soft); border-radius: 10px; padding: 6px 10px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v">
  <p class="cap">Veil over a button</p>
  <div class="stage"><button type="button" class="btn">Continue</button><div class="veil"></div></div>
</section>
<section class="v">
  <p class="cap">Pass-through container with a live child</p>
  <div class="stage"><button type="button" class="btn">Save</button><div class="toasts"><div class="toast"><span>Saved</span> <button type="button" class="btn">Undo</button></div></div></div>
</section>
</main>
</body>
</html>
