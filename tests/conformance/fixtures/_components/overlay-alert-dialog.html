    <div id="delete-account-layer" class="contents" data-fixture-modal hidden><div data-state="closed" data-slot="alert-dialog-overlay" class="fixed inset-0 isolate z-50 bg-black/10 duration-100 supports-backdrop-filter:backdrop-blur-xs data-open:animate-in data-open:fade-in-0 data-closed:animate-out data-closed:fade-out-0"></div><div role="alertdialog" aria-modal="true" data-state="closed" data-slot="alert-dialog-content" data-size="default" class="group/alert-dialog-content fixed top-1/2 left-1/2 z-50 grid w-full -translate-x-1/2 -translate-y-1/2 gap-4 rounded-xl bg-popover p-4 text-popover-foreground ring-1 ring-foreground/10 duration-100 outline-none data-[size=default]:max-w-xs data-[size=sm]:max-w-xs data-[size=default]:sm:max-w-sm data-open:animate-in data-open:fade-in-0 data-open:zoom-in-95 data-closed:animate-out data-closed:fade-out-0 data-closed:zoom-out-95" tabindex="-1" aria-labelledby="delete-account-title"><div data-slot="alert-dialog-header" class="grid grid-rows-[auto_1fr] place-items-center gap-1.5 text-center"><h2 id="delete-account-title" data-slot="alert-dialog-title" class="font-heading text-base font-medium">Delete your account?</h2><p data-slot="alert-dialog-description" class="text-sm text-balance text-muted-foreground md:text-pretty">Your projects and deployments are removed permanently. This cannot be undone.</p></div><div data-slot="alert-dialog-footer" class="-mx-4 -mb-4 flex flex-col-reverse gap-2 rounded-b-xl border-t bg-muted/50 p-4 sm:flex-row sm:justify-end"><button type="button" data-slot="alert-dialog-cancel" class="group/button inline-flex shrink-0 items-center justify-center rounded-lg border bg-clip-padding text-sm font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 [&amp;_svg:not([class*='size-'])]:size-4 border-border bg-background hover:bg-muted hover:text-foreground aria-expanded:bg-muted aria-expanded:text-foreground dark:border-input dark:bg-input/30 dark:hover:bg-input/50 h-8 gap-1.5 px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2" data-variant="outline" data-size="default" data-fixture-close>Cancel</button><button type="button" data-slot="alert-dialog-action" class="group/button inline-flex shrink-0 items-center justify-center rounded-lg border border-transparent bg-clip-padding text-sm font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 [&amp;_svg:not([class*='size-'])]:size-4 bg-primary text-primary-foreground hover:bg-primary/80 h-8 gap-1.5 px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2" data-variant="default" data-size="default" data-fixture-close>Continue</button></div></div></div>
<script>
// Fixture stand-in for Radix portals. data-fixture-opens="<layer element id>" on a trigger; [data-fixture-close]
// closes; [data-fixture-scrim] or (non-modal) any outside click closes; Escape closes; hover triggers open after 300 ms.
// [data-fixture-popper] content is placed like Radix's popper: fixed 0,0, translated under the trigger, centred.
const root = document.querySelector("[data-markswift-root]");
let current;
// Radix sets data-state on the trigger and on each portal part, and keeps the parts mounted until their exit
// animations end (Presence).
const set = (t, el, open) => {
  for (const x of [t, el, ...el.querySelectorAll("[data-state]")]) {
    x.setAttribute("data-state", open ? "open" : "closed");
    x.toggleAttribute("data-open", open);
    x.toggleAttribute("data-closed", !open);
  }
  t.setAttribute("aria-expanded", String(open));
  const exits = open ? [] : el.getAnimations({ subtree: true });
  const hide = () => (el.hidden = current?.el !== el);
  if (exits.length) Promise.all(exits.map((a) => a.finished.catch(() => {}))).then(hide);
  else el.hidden = !open;
  if (open && el.dataset.fixturePopper !== undefined) {
    const r = t.getBoundingClientRect();
    const x = Math.min(Math.max(r.left + (r.width - el.offsetWidth) / 2, 0), innerWidth - el.offsetWidth);
    el.style.transform = `translate(${Math.round(x)}px, ${Math.round(r.bottom + 4)}px)`;
  }
  if (el.dataset.fixtureModal !== undefined) root.toggleAttribute("aria-hidden", open);
  current = open ? { t, el } : undefined;
  if (open) el.querySelector("input, button")?.focus();
};
const close = () => current && set(current.t, current.el, false);
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-fixture-opens]:not([data-fixture-hover])");
  if (t) return set(t, document.getElementById(t.dataset.fixtureOpens), true);
  if (!current) return;
  if (e.target.closest("[data-fixture-close], [data-fixture-scrim]")) return close();
  if (current.el.dataset.fixtureModal === undefined && !current.el.contains(e.target)) close();
});
document.addEventListener("keydown", (e) => e.key === "Escape" && close());
for (const t of document.querySelectorAll("[data-fixture-hover]"))
  t.addEventListener("mouseenter", () => setTimeout(() => set(t, document.getElementById(t.dataset.fixtureOpens), true), 300));
</script>
  </body>
