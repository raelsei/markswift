<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=393, initial-scale=1" />
    <title>native dialog and popover — shadcn/ui</title>
    <meta name="markswift-themes" content="light,dark" />
    <meta name="markswift-viewport-height" content="844" />
    <meta name="markswift-rows" content="dialog; @popover; @popovertarget; @command; @commandfor" />
    <!-- tailwind-v4 globals.css -->
  </head>
  <body class="bg-background text-foreground">
    <div data-markswift-root class="w-[393px] min-h-svh p-4 bg-background text-foreground"><div class="flex flex-col gap-5"><button commandfor="d" command="show-modal" class="group/button inline-flex shrink-0 items-center justify-center rounded-lg border bg-clip-padding text-sm font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 [&amp;_svg:not([class*='size-'])]:size-4 border-border bg-background hover:bg-muted hover:text-foreground aria-expanded:bg-muted aria-expanded:text-foreground dark:border-input dark:bg-input/30 dark:hover:bg-input/50 h-8 gap-1.5 px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2" type="button">Open dialog</button><button popovertarget="p" class="group/button inline-flex shrink-0 items-center justify-center rounded-lg border bg-clip-padding text-sm font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 [&amp;_svg:not([class*='size-'])]:size-4 border-border bg-background hover:bg-muted hover:text-foreground aria-expanded:bg-muted aria-expanded:text-foreground dark:border-input dark:bg-input/30 dark:hover:bg-input/50 h-8 gap-1.5 px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2" type="button" style="anchor-name: --open-popover">Open popover</button></div></div>
    <dialog id="d" closedby="any" class="m-auto w-[calc(100%-2rem)] max-w-sm rounded-xl bg-popover p-4 text-sm text-popover-foreground ring-1 ring-foreground/10 backdrop:bg-black/10"><div class="flex flex-col gap-2"><h2 class="font-heading text-base leading-none font-medium">Native dialog</h2><p class="text-sm text-muted-foreground">A modal &lt;dialog&gt; opened by a command button.</p></div></dialog><div id="p" popover class="w-72 rounded-lg bg-popover p-2.5 text-sm text-popover-foreground shadow-md ring-1 ring-foreground/10" style="position-anchor: --open-popover; inset: auto; top: anchor(bottom); left: anchor(left); margin: 4px 0 0 0;"><div class="font-medium">Native popover</div><p class="text-muted-foreground">Anchored under its popovertarget button.</p></div>

  </body>
</html>
