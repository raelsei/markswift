<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=393, initial-scale=1" />
    <title>hover-card — shadcn/ui</title>
    <meta name="markswift-themes" content="light,dark" />
    <meta name="markswift-viewport-height" content="844" />
    <meta name="markswift-rows" content="@popover; a" />
    <!-- tailwind-v4 globals.css -->
  </head>
  <body class="bg-background text-foreground">
    <div data-markswift-root class="w-[393px] min-h-svh p-4 bg-background text-foreground"><div class="flex flex-col gap-5"><a data-state="closed" data-slot="hover-card-trigger" data-fixture-hover data-fixture-opens="nextjs-card" href="#nextjs" class="self-start text-sm font-medium underline underline-offset-4">@nextjs</a></div></div>
    <div id="nextjs-card" data-radix-popper-content-wrapper="" data-fixture-popper hidden style="position: fixed; left: 0px; top: 0px; transform: translate(0px, 0px); min-width: max-content; z-index: 50;"><div data-side="bottom" data-align="center" data-state="closed" data-slot="hover-card-content" class="z-50 rounded-lg bg-popover p-2.5 text-sm text-popover-foreground shadow-md ring-1 ring-foreground/10 outline-hidden duration-100 data-[side=bottom]:slide-in-from-top-2 data-open:animate-in data-open:fade-in-0 data-open:zoom-in-95 data-closed:animate-out data-closed:fade-out-0 data-closed:zoom-out-95 w-72"><div class="flex gap-3"><span data-slot="avatar" data-size="default" class="group/avatar relative flex size-8 shrink-0 rounded-full select-none after:absolute after:inset-0 after:rounded-full after:border after:border-border after:mix-blend-darken dark:after:mix-blend-lighten"><span data-slot="avatar-fallback" class="flex size-full items-center justify-center rounded-full bg-muted text-sm text-muted-foreground">NJ</span></span><div class="flex flex-col gap-1"><span class="text-sm font-semibold">Next.js</span><span class="text-xs text-muted-foreground">The React Framework – created and maintained by @vercel.</span><span class="flex items-center gap-1 text-xs text-muted-foreground"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar size-3" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg> Joined December 2021</span></div></div></div></div>
<script>
// Fixture stand-in for Radix portals. data-fixture-opens="<layer element id>" on a trigger; [data-fixture-close]
// closes; [data-fixture-scrim] or (non-modal) any outside click closes; Escape closes; hover triggers open after 300 ms.
// [data-fixture-popper] content is placed like Radix's popper: fixed 0,0, translated under the trigger, centred.
const root = document.querySelector("[data-markswift-root]");
let current;
// Radix sets data-state on the trigger and on each portal part, and keeps the parts mounted until their exit
// animations end (Presence).
const set = (t, el, open) => {
  for (const x of [t, el, ...el.querySelectorAll("[data-state]")]) {
    x.setAttribute("data-state", open ? "open" : "closed");
    x.toggleAttribute("data-open", open);
    x.toggleAttribute("data-closed", !open);
  }
  t.setAttribute("aria-expanded", String(open));
  const exits = open ? [] : el.getAnimations({ subtree: true });
  const hide = () => (el.hidden = current?.el !== el);
  if (exits.length) Promise.all(exits.map((a) => a.finished.catch(() => {}))).then(hide);
  else el.hidden = !open;
  if (open && el.dataset.fixturePopper !== undefined) {
    const r = t.getBoundingClientRect();
    const x = Math.min(Math.max(r.left + (r.width - el.offsetWidth) / 2, 0), innerWidth - el.offsetWidth);
    el.style.transform = `translate(${Math.round(x)}px, ${Math.round(r.bottom + 4)}px)`;
  }
  if (el.dataset.fixtureModal !== undefined) root.toggleAttribute("aria-hidden", open);
  current = open ? { t, el } : undefined;
  if (open) el.querySelector("input, button")?.focus();
};
const close = () => current && set(current.t, current.el, false);
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-fixture-opens]:not([data-fixture-hover])");
  if (t) return set(t, document.getElementById(t.dataset.fixtureOpens), true);
  if (!current) return;
  if (e.target.closest("[data-fixture-close], [data-fixture-scrim]")) return close();
  if (current.el.dataset.fixtureModal === undefined && !current.el.contains(e.target)) close();
});
document.addEventListener("keydown", (e) => e.key === "Escape" && close());
for (const t of document.querySelectorAll("[data-fixture-hover]"))
  t.addEventListener("mouseenter", () => setTimeout(() => set(t, document.getElementById(t.dataset.fixtureOpens), true), 300));
</script>
  </body>
</html>
