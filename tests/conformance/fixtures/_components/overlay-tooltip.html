<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=393, initial-scale=1" />
    <title>tooltip — shadcn/ui</title>
    <meta name="markswift-themes" content="light,dark" />
    <!-- tailwind-v4 globals.css -->
  </head>
  <body class="bg-background text-foreground">
    <div data-markswift-root class="w-[393px] p-4 bg-background text-foreground">
      <div class="flex items-center gap-3">
        <button id="hover" type="button" data-slot="tooltip-trigger" data-variant="outline" data-size="default" class="group/button inline-flex shrink-0 items-center justify-center rounded-lg border bg-clip-padding text-sm font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 border-border bg-background hover:bg-muted hover:text-foreground aria-expanded:bg-muted aria-expanded:text-foreground dark:border-input dark:bg-input/30 dark:hover:bg-input/50 h-8 gap-1.5 px-2.5">Hover</button>
        <button id="info" type="button" interestfor="tip" class="inline-flex h-8 shrink-0 items-center justify-center rounded-lg border border-border bg-background px-2.5 text-sm font-medium whitespace-nowrap dark:border-input dark:bg-input/30">Info</button>
        <button id="save" type="button" title="Save draft" class="inline-flex h-8 shrink-0 items-center justify-center rounded-lg border border-border bg-background px-2.5 text-sm font-medium whitespace-nowrap dark:border-input dark:bg-input/30">Save</button>
      </div>
      <div popover="hint" id="tip" class="m-0 top-14 left-24 right-auto bottom-auto rounded-md bg-foreground px-3 py-1.5 text-xs text-background">More information</div>
    </div>
    <div id="hover-tip" role="tooltip" data-slot="tooltip-content" hidden class="fixed top-14 left-4 z-50 inline-flex w-fit max-w-xs items-center gap-1.5 rounded-md bg-foreground px-3 py-1.5 text-xs text-background">Add to library</div>
    <script>
      // Radix-like delay: the tooltip appears 300 ms after the pointer enters its trigger.
      const trigger = document.getElementById("hover");
      const tip = document.getElementById("hover-tip");
      let timer;
      trigger.addEventListener("mouseenter", () => {
        timer = setTimeout(() => {
          tip.hidden = false;
          trigger.setAttribute("aria-describedby", "hover-tip");
        }, 300);
      });
      trigger.addEventListener("mouseleave", () => {
        clearTimeout(timer);
        tip.hidden = true;
        trigger.removeAttribute("aria-describedby");
      });
    </script>
  </body>
</html>
