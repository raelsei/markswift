linejoin="round" class="lucide lucide-chevron-down pointer-events-none shrink-0 group-aria-expanded/accordion-trigger:hidden" aria-hidden="true" data-slot="accordion-trigger-icon"><path d="m6 9 6 6 6-6"></path></svg><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-up pointer-events-none hidden shrink-0 group-aria-expanded/accordion-trigger:inline" aria-hidden="true" data-slot="accordion-trigger-icon"><path d="m18 15-6-6-6 6"></path></svg></button></h3><div data-state="closed" id="accordion-content-3" hidden="" role="region" aria-labelledby="accordion-trigger-3" data-orientation="vertical" data-slot="accordion-content" class="overflow-hidden text-sm data-open:animate-accordion-down data-closed:animate-accordion-up" style="--radix-accordion-content-height:var(--radix-collapsible-content-height);--radix-accordion-content-width:var(--radix-collapsible-content-width)"><div class="h-(--radix-accordion-content-height) pt-0 pb-2.5 [&amp;_a]:underline [&amp;_a]:underline-offset-3 [&amp;_a]:hover:text-foreground [&amp;_p:not(:last-child)]:mb-4">Yes: 99.9% monthly uptime on paid plans, with service credits for any shortfall.</div></div></div></div></div>
<script>
// Fixture stand-in for Radix: a trigger with aria-controls toggles its target.
document.addEventListener("click", (e) => {
  const t = e.target.closest("[aria-controls][aria-expanded]");
  const target = t && document.getElementById(t.getAttribute("aria-controls"));
  if (!target) return;
  const open = t.getAttribute("aria-expanded") !== "true";
  for (const el of [t, target]) {
    el.setAttribute("data-state", open ? "open" : "closed");
    el.toggleAttribute("data-open", open);
    el.toggleAttribute("data-closed", !open);
  }
  t.setAttribute("aria-expanded", String(open));
  target.hidden = !open;
});
</script>
