<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="img; @src; @srcset; remote-image">
<meta name="markswift-themes" content="light,dark">
<title>remote-image</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.slot { width: 100px; height: 100px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); overflow: hidden; }
.slot img { width: 100px; height: 100px; display: block; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="remote-img">
  <p class="cap">remote image with 2x srcset</p>
  <div class="slot">
    <img src="../assets/test-image.png" srcset="../assets/test-image.png 1x, ../assets/test-image@2x.png 2x" width="100" height="100" alt="Remote blue square">
  </div>
</section>
</main>
</body>
</html>
