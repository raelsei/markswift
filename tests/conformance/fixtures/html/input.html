<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="input; input: text; input: password; input: checkbox; input: radio; input: range; @placeholder; @value; @checked; @type; label; @for">
<meta name="markswift-themes" content="light,dark">
<title>input</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
label { font-size: 13px; color: var(--muted); }
input[type="text"], input[type="password"] { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); }
.check { display: flex; gap: 16px; align-items: center; }
.check label { display: flex; align-items: center; gap: 6px; color: var(--fg); font-size: 14px; }
input[type="range"] { width: 100%; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="text-fields">
  <p class="cap">text with placeholder / text with value / password</p>
  <div class="field"><label for="email">Email</label><input id="email" type="text" placeholder="you@example.com"></div>
  <div class="field"><label for="name">Name</label><input id="name" type="text" value="Ada Lovelace"></div>
  <div class="field"><label for="pw">Password</label><input id="pw" type="password" value="secret123"></div>
</section>
<section class="v" id="checks">
  <p class="cap">checkbox checked/unchecked, radio group</p>
  <div class="check"><label><input type="checkbox" checked> Remember me</label><label><input type="checkbox"> Newsletter</label></div>
  <div class="check" style="margin-top: 8px;"><label><input type="radio" name="plan" checked> Monthly</label><label><input type="radio" name="plan"> Yearly</label></div>
</section>
<section class="v" id="range"><p class="cap">range at 60 of 100</p><input type="range" min="0" max="100" value="60"></section>
</main>
</body>
</html>
