<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="a; @href">
<meta name="markswift-themes" content="light,dark">
<title>a</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
p.s { margin: 0; }
a { color: var(--accent); }
.card { display: block; text-decoration: none; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.card strong { display: block; margin-bottom: 4px; }
.card span { color: var(--muted); font-size: 13px; }
.nav { display: flex; gap: 16px; }
.nav a { text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="inline-link"><p class="cap">inline link inside a sentence</p><p class="s">Read the <a href="#terms">terms of service</a> before continuing.</p></section>
<section class="v" id="card-link"><p class="cap">block card link</p><a class="card" href="#article"><strong>Release notes 2.4</strong><span>Faster sync and new export options.</span></a></section>
<section class="v" id="nav-links"><p class="cap">nav row of plain links</p><nav class="nav"><a href="#home">Home</a><a href="#search">Search</a><a href="#profile">Profile</a></nav></section>
</main>
</body>
</html>
