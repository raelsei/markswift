<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="table; caption; thead; tbody; tr; th; td; @colspan; tfoot">
<meta name="markswift-themes" content="light,dark">
<title>table</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--card); border-radius: 10px; }
caption { caption-side: top; text-align: left; font-weight: 600; padding: 0 0 6px; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; }
th { background: var(--soft); font-weight: 600; }
td.n, th.n { text-align: right; }
tfoot td { font-weight: 600; border-bottom: 0; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="table">
  <p class="cap">header row, 3 columns, footer with colspan=2</p>
  <table>
    <caption>Quarterly sales</caption>
    <thead><tr><th>Region</th><th>Rep</th><th class="n">Total</th></tr></thead>
    <tbody>
      <tr><td>North</td><td>Ada</td><td class="n">1,200</td></tr>
      <tr><td>South</td><td>Grace</td><td class="n">980</td></tr>
      <tr><td>West</td><td>Linus</td><td class="n">1,430</td></tr>
    </tbody>
    <tfoot><tr><td colspan="2">Sum</td><td class="n">3,610</td></tr></tfoot>
  </table>
</section>
</main>
</body>
</html>
