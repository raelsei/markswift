<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="validation; required; email; pattern; invalid; data-state; shortcuts; tabindex">
<meta name="markswift-themes" content="light,dark">
<title>validation-states</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f9fafb;
  --fg: #111827;
  --card: #ffffff;
  --line: #d1d5db;
  --line-err: #ef4444;
  --muted: #6b7280;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --soft-err: #fee2e2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0e13;
    --fg: #f3f4f6;
    --card: #161b24;
    --line: #374151;
    --line-err: #f87171;
    --muted: #9ca3af;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --soft-err: #450a0a;
  }
}
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 20px; }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 20px; background: var(--bg); }
.sec { margin-bottom: 20px; }
.title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin: 0 0 10px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
label { font-size: 13px; font-weight: 500; color: var(--muted); }
input { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); outline: none; box-sizing: border-box; width: 100%; }
input[aria-invalid="true"] { border-color: var(--line-err); background: var(--soft-err); }
.btn-row { display: flex; gap: 10px; align-items: center; }
button { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #ffffff; cursor: pointer; }
button:hover { background: var(--accent-hover); }
button.secondary { background: var(--card); color: var(--fg); border: 1px solid var(--line); }
button[data-state="open"] { background: #059669; }
</style>
</head>
<body>
<main data-markswift-root>
  <div class="sec">
    <p class="title">Form Validation</p>
    <div class="field">
      <label for="f-name">Full Name (Required)</label>
      <input id="f-name" type="text" placeholder="Ada Lovelace" required>
    </div>
    <div class="field">
      <label for="f-email">Email Address</label>
      <input id="f-email" type="email" placeholder="ada@example.com">
    </div>
    <div class="field">
      <label for="f-code">Postal Code (Pattern)</label>
      <input id="f-code" type="text" placeholder="123-456" pattern="[0-9]{3}-[0-9]{3}">
    </div>
    <div class="field">
      <label for="f-err">Server Error</label>
      <input id="f-err" type="text" value="invalid_token" aria-invalid="true">
    </div>
  </div>

  <div class="sec">
    <p class="title">Data State &amp; Keyboard</p>
    <div class="btn-row">
      <button id="btn-save" type="submit" aria-keyshortcuts="Meta+S">Save</button>
      <button id="btn-toggle" class="secondary" data-state="open" data-slot="accordion-trigger">Details</button>
      <button id="btn-skip" class="secondary" tabindex="-1">Skip</button>
    </div>
  </div>
</main>
</body>
</html>
