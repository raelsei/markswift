<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="select; option; @multiple; @size; @selected">
<meta name="markswift-themes" content="light,dark">
<title>select-multiple</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
label { font-size: 13px; color: var(--muted); }
select[multiple] { font: inherit; width: 100%; box-sizing: border-box; padding: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="multi-size">
  <p class="cap">select multiple size=4 with two items selected</p>
  <div class="field">
    <label for="cars">Vehicles</label>
    <select id="cars" multiple size="4">
      <option value="sedan">Sedan</option>
      <option value="suv" selected>SUV</option>
      <option value="truck">Truck</option>
      <option value="van" selected>Van</option>
    </select>
  </div>
</section>
<section class="v" id="multi-default">
  <p class="cap">select multiple default size</p>
  <div class="field">
    <label for="toppings">Toppings</label>
    <select id="toppings" multiple>
      <option selected>Mushrooms</option>
      <option>Onions</option>
      <option selected>Olives</option>
      <option>Peppers</option>
    </select>
  </div>
</section>
</main>
</body>
</html>
