<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="sub; sup; mark; kbd; small; abbr; strong; em; b; i; s; u; del; ins; time; var; span">
<meta name="markswift-themes" content="light,dark">
<title>text-level-semantics</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
p.s { margin: 0 0 8px; }
p.s:last-child { margin-bottom: 0; }
mark { background: #fde047; color: #111827; padding: 0 2px; }
kbd { font-family: ui-monospace, monospace; font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--card); }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="semantics">
  <p class="cap">inline text-level elements in running text</p>
  <p class="s">Water is H<sub>2</sub>O and E = mc<sup>2</sup>; a <mark>highlighted</mark> phrase.</p>
  <p class="s">Press <kbd>Ctrl</kbd> + <kbd>C</kbd>. <small>Small print follows.</small> <abbr title="HyperText Markup Language">HTML</abbr> abbreviation.</p>
  <p class="s"><strong>Strong</strong>, <em>emphasis</em>, <b>bold</b>, <i>italic</i>, <s>struck</s>, <u>underlined</u>.</p>
  <p class="s"><del>Old price 40</del> <ins>New price 32</ins>, updated <time datetime="2026-01-01">1 Jan</time>; variable <var>x</var> in a <span>plain span</span>.</p>
</section>
</main>
</body>
</html>
