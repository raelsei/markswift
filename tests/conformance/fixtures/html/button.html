<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="button; @disabled; @type">
<meta name="markswift-themes" content="light,dark">
<title>button</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
button { font: inherit; font-size: 14px; line-height: 20px; border-radius: 10px; padding: 8px 16px; cursor: pointer; }
.filled { background: var(--accent); color: var(--accent-fg); border: 0; font-weight: 600; }
.outlined { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
.ghost { background: transparent; color: var(--fg); border: 0; }
.icon { width: 40px; height: 40px; padding: 0; border-radius: 50%; background: var(--soft); border: 0; display: inline-flex; align-items: center; justify-content: center; }
.icon svg { width: 20px; height: 20px; fill: none; stroke: var(--accent); stroke-width: 2; }
button:disabled { opacity: 0.45; cursor: default; }
.wide { width: 100%; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="buttons">
  <p class="cap">filled / outlined / ghost / icon-only</p>
  <div class="row">
    <button type="button" class="filled">Continue</button>
    <button type="button" class="outlined">Cancel</button>
    <button type="button" class="ghost">Skip</button>
    <button type="button" class="icon" aria-label="Add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
</section>
<section class="v" id="disabled">
  <p class="cap">disabled filled and outlined</p>
  <div class="row"><button type="button" class="filled" disabled>Continue</button><button type="button" class="outlined" disabled>Cancel</button></div>
</section>
<section class="v" id="full-width"><p class="cap">full-width submit</p><button type="submit" class="filled wide">Sign in</button></section>
</main>
</body>
</html>
