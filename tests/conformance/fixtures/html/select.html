<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="select; option; @selected; textarea; @rows; @cols">
<meta name="markswift-themes" content="light,dark">
<title>select</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
label { font-size: 13px; color: var(--muted); }
select, textarea { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); }
textarea { resize: none; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="select">
  <p class="cap">select with the second option selected</p>
  <div class="field"><label for="country">Country</label><select id="country"><option>Canada</option><option selected>Germany</option><option>Japan</option></select></div>
</section>
<section class="v" id="textarea">
  <p class="cap">textarea rows=3 with default text, and an empty rows=2</p>
  <div class="field"><label for="bio">Bio</label><textarea id="bio" rows="3">Designer and developer based in Berlin.</textarea></div>
  <div class="field"><label for="note">Note</label><textarea id="note" rows="2" cols="30" placeholder="Add a note"></textarea></div>
</section>
</main>
</body>
</html>
