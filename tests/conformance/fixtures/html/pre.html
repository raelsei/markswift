<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="pre; code; samp; kbd">
<meta name="markswift-themes" content="light,dark">
<title>pre</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
pre { margin: 0; background: #111827; color: #e5e7eb; border-radius: 10px; padding: 10px 12px; font-family: ui-monospace, monospace; font-size: 13px; line-height: 18px; overflow-x: auto; }
code { font-family: ui-monospace, monospace; font-size: 13px; background: var(--soft); padding: 1px 5px; border-radius: 4px; }
p.s { margin: 0; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="block"><p class="cap">pre > code block with indentation</p><pre><code>function greet(name) {
  return `Hello, ${name}`;
}</code></pre></section>
<section class="v" id="inline"><p class="cap">inline code, samp and kbd in a sentence</p><p class="s">Run <code>bun install</code>, expect <samp>done</samp>, then press <kbd>⌘</kbd> + <kbd>S</kbd>.</p></section>
</main>
</body>
</html>
