<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="ul; ol; li; @start; @reversed">
<meta name="markswift-themes" content="light,dark">
<title>ul</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
ul, ol { margin: 0; padding-left: 22px; }
li { margin: 2px 0; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="lists">
  <p class="cap">bullets / numbers</p>
  <div class="cols"><ul><li>Milk</li><li>Eggs</li><li>Bread</li></ul><ol><li>Preheat</li><li>Mix</li><li>Bake</li></ol></div>
</section>
<section class="v" id="nested">
  <p class="cap">nested list</p>
  <ul><li>Fruit<ul><li>Apple</li><li>Pear</li></ul></li><li>Vegetables<ol><li>Carrot</li><li>Leek</li></ol></li></ul>
</section>
<section class="v" id="start-reversed">
  <p class="cap">ol start="5" / reversed</p>
  <div class="cols"><ol start="5"><li>Five</li><li>Six</li></ol><ol reversed><li>Three</li><li>Two</li><li>One</li></ol></div>
</section>
</main>
</body>
</html>
