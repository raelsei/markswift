<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="blockquote; cite; q">
<meta name="markswift-themes" content="light,dark">
<title>blockquote</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
blockquote { margin: 0; padding: 8px 14px; border-left: 4px solid var(--accent); background: var(--card); border-radius: 0 10px 10px 0; }
blockquote p { margin: 0 0 4px; font-style: italic; }
cite { font-style: normal; color: var(--muted); font-size: 13px; }
p.s { margin: 0; }
.plain { border: 0; background: transparent; padding: 0 0 0 24px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="quote"><p class="cap">styled blockquote with cite</p><blockquote><p>Simplicity is the ultimate sophistication.</p><cite>— Leonardo da Vinci</cite></blockquote></section>
<section class="v" id="plain"><p class="cap">plain indented blockquote and inline q</p><blockquote class="plain"><p>Less, but better.</p></blockquote><p class="s">He simply said <q>ship it</q>.</p></section>
</main>
</body>
</html>
