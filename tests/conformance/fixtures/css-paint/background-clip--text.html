<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="background-clip; background-clip: text; -webkit-text-fill-color; -webkit-text-fill-color: transparent">
<meta name="markswift-themes" content="light,dark">
<title>background-clip--text</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.grad { margin: 0; font-size: 34px; line-height: 40px; font-weight: 800; background-image: linear-gradient(90deg, #2563eb, #db2777); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
.pad { background-color: #2563eb; background-clip: padding-box; border: 8px solid rgba(37, 99, 235, 0.3); border-radius: 12px; padding: 10px 12px; color: #fff; }
.content { background-color: #16a34a; background-clip: content-box; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; color: #fff; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="clip-text"><p class="cap">background-clip: text gradient headline</p><h1 class="grad">Gradient text</h1></section>
<section class="v" id="clip-padding"><p class="cap">background-clip: padding-box under a translucent border</p><div class="pad">padding-box</div></section>
<section class="v" id="clip-content"><p class="cap">background-clip: content-box</p><div class="content">content-box</div></section>
</main>
</body>
</html>
