<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="outline-style; outline-width; outline-color; outline-offset">
<meta name="markswift-themes" content="light,dark">
<title>outline-style</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.row { display: flex; gap: 20px; padding: 8px 6px; }
.o { width: 88px; height: 44px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 12px; }
.solid { outline: 2px solid #2563eb; outline-offset: 2px; }
.dashed { outline: 2px dashed #db2777; outline-offset: 0; }
.thick { outline: 4px solid #16a34a; outline-offset: -6px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="outline">
  <p class="cap">2px solid offset 2 / 2px dashed / 4px solid offset -6 (inside)</p>
  <div class="row"><div class="o solid">solid</div><div class="o dashed">dashed</div><div class="o thick">inside</div></div>
</section>
</main>
</body>
</html>
