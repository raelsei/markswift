<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="border-top-style; border-top-style: none; border-top-style: solid; border-top-style: dashed; border-top-style: dotted; border-top-style: double; border-top-style: groove">
<meta name="markswift-themes" content="light,dark">
<title>border-top-style</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.s { height: 56px; border: 3px solid #2563eb; border-radius: 8px; background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 12px; }
.solid { border-style: solid; }
.dashed { border-style: dashed; }
.dotted { border-style: dotted; }
.double { border-style: double; border-width: 6px; }
.groove { border-style: groove; border-width: 6px; }
.none { border-style: none; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="bs-basic">
  <p class="cap">solid / dashed / dotted at 3px</p>
  <div class="tiles"><div class="s solid">solid</div><div class="s dashed">dashed</div><div class="s dotted">dotted</div></div>
</section>
<section class="v" id="bs-fancy">
  <p class="cap">double 6px / groove 6px / none</p>
  <div class="tiles"><div class="s double">double</div><div class="s groove">groove</div><div class="s none">none</div></div>
</section>
</main>
</body>
</html>
