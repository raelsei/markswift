<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="clip-path; clip-path: circle(); clip-path: inset(); clip-path: polygon(); clip-path: ellipse()">
<meta name="markswift-themes" content="light,dark">
<title>clip-path</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.c { height: 80px; background: linear-gradient(135deg, #2563eb, #9333ea); }
.circle { clip-path: circle(40% at 50% 50%); }
.inset { clip-path: inset(10% 15% round 12px); }
.poly { clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%); }
.ell { clip-path: ellipse(45% 30% at 50% 50%); }
.lbl { font-size: 11px; color: var(--muted); text-align: center; margin: 4px 0 0; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="clip">
  <p class="cap">circle(40%) / inset(10% 15% round 12px) / polygon pentagon / ellipse(45% 30%)</p>
  <div class="tiles">
    <div><div class="c circle"></div><p class="lbl">circle</p></div>
    <div><div class="c inset"></div><p class="lbl">inset</p></div>
    <div><div class="c poly"></div><p class="lbl">polygon</p></div>
    <div><div class="c ell"></div><p class="lbl">ellipse</p></div>
  </div>
</section>
</main>
</body>
</html>
