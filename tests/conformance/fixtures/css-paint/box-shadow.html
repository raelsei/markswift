<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="box-shadow; box-shadow: inset">
<meta name="markswift-themes" content="light,dark">
<title>box-shadow</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 8px 4px; }
.s { height: 72px; border-radius: 12px; background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 12px; }
.soft { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); }
.hard { box-shadow: 4px 4px 0 #2563eb; }
.multi { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 12px 32px rgba(37, 99, 235, 0.35); }
.ring { box-shadow: 0 0 0 3px #22c55e; }
.inset { box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.35); background: var(--soft); }
.hl { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 2px 4px rgba(0, 0, 0, 0.2); background: #2563eb; color: #fff; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="shadow-outer">
  <p class="cap">soft outer / hard offset / multiple</p>
  <div class="tiles"><div class="s soft">soft</div><div class="s hard">hard</div><div class="s multi">multi</div></div>
</section>
<section class="v" id="shadow-inset">
  <p class="cap">spread ring / inset / inset highlight + outer</p>
  <div class="tiles"><div class="s ring">ring</div><div class="s inset">inset</div><div class="s hl">highlight</div></div>
</section>
</main>
</body>
</html>
