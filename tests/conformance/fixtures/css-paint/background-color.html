<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="background-color">
<meta name="markswift-themes" content="light,dark">
<title>background-color</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tiles.two { grid-template-columns: repeat(2, 1fr); }
.t { height: 84px; border-radius: 12px; display: flex; align-items: flex-end; padding: 6px 8px; box-sizing: border-box; color: #fff; font-size: 11px; line-height: 14px; font-weight: 600; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.solid { background-color: #2563eb; }
.named { background-color: rebeccapurple; }
.alpha { background-color: rgba(220, 38, 38, 0.4); color: var(--fg); }
.stripe { background: repeating-linear-gradient(90deg, var(--line) 0 10px, transparent 10px 20px); border-radius: 12px; padding: 8px; }
.none { background-color: transparent; border: 1px dashed var(--muted); color: var(--fg); text-shadow: none; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="bg-solid">
  <p class="cap">solid hex, named, transparent</p>
  <div class="tiles"><div class="t solid">#2563eb</div><div class="t named">rebeccapurple</div><div class="t none">transparent</div></div>
</section>
<section class="v" id="bg-alpha">
  <p class="cap">rgba(220, 38, 38, 0.4) over stripes</p>
  <div class="stripe"><div class="t alpha">40% red</div></div>
</section>
</main>
</body>
</html>
