<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="opacity">
<meta name="markswift-themes" content="light,dark">
<title>opacity</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.o { height: 64px; border-radius: 12px; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.o60 { opacity: 0.6; }
.o30 { opacity: 0.3; }
.group { opacity: 0.5; display: flex; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.dot { width: 24px; height: 24px; border-radius: 50%; background: #dc2626; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="opacity-steps">
  <p class="cap">opacity 1 / 0.6 / 0.3</p>
  <div class="tiles"><div class="o">1</div><div class="o o60">0.6</div><div class="o o30">0.3</div></div>
</section>
<section class="v" id="opacity-group">
  <p class="cap">group opacity 0.5 on a card with children</p>
  <div class="group"><div class="dot"></div><span>Faded card with a red dot and text</span></div>
</section>
</main>
</body>
</html>
