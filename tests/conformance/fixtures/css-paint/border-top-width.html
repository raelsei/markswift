<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="border-top-width; border-top-color; border-top-style; border-bottom-width; border-bottom-color; border-bottom-style; border-left-width; border-left-color; border-left-style; border-right-width; border-right-color; border-right-style">
<meta name="markswift-themes" content="light,dark">
<title>border-top-width</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.item { padding: 10px 12px; background: var(--card); }
.divider { border-bottom: 1px solid var(--line); }
.accent { border-left: 4px solid #2563eb; border-radius: 6px; margin-bottom: 8px; }
.ring { border: 2px solid #16a34a; border-radius: 10px; }
.mixed { border-top: 6px solid #ef4444; border-right: 3px dashed #f59e0b; border-bottom: 1px dotted #22c55e; border-left: 10px double #3b82f6; border-radius: 6px; }
.topbar { border-top: 4px solid #db2777; border-radius: 0 0 10px 10px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="border-b">
  <p class="cap">border-bottom 1px dividers only</p>
  <div class="item divider">First row</div><div class="item divider">Second row</div><div class="item">Third row</div>
</section>
<section class="v" id="border-l">
  <p class="cap">left accent bar 4px / top bar 4px</p>
  <div class="item accent">Left accent</div><div class="item topbar">Top bar</div>
</section>
<section class="v" id="border-ring">
  <p class="cap">full ring 2px</p>
  <div class="item ring">All sides</div>
</section>
<section class="v" id="border-mixed">
  <p class="cap">four different widths/colors/styles: 6 solid, 3 dashed, 1 dotted, 10 double</p>
  <div class="item mixed">Mixed sides</div>
</section>
</main>
</body>
</html>
