<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="border-top-left-radius; border-top-right-radius; border-bottom-left-radius; border-bottom-right-radius; border-top-left-radius: 50%; border-top-left-radius: 24px 12px">
<meta name="markswift-themes" content="light,dark">
<title>border-top-left-radius</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.row { display: flex; gap: 12px; align-items: flex-start; }
.r { width: 72px; height: 72px; background: #2563eb; color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; text-align: center; }
.px { border-radius: 12px; }
.circle { border-radius: 50%; }
.ell { border-radius: 24px 12px; }
.uneven { border-top-left-radius: 24px; border-top-right-radius: 4px; border-bottom-right-radius: 24px; border-bottom-left-radius: 0; }
.pill { width: 140px; height: 40px; border-radius: 999px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="radius-shapes">
  <p class="cap">12px / 50% circle / 24px 12px elliptical / uneven corners</p>
  <div class="row"><div class="r px">12px</div><div class="r circle">50%</div><div class="r ell">24 12</div><div class="r uneven">uneven</div></div>
</section>
<section class="v" id="radius-pill">
  <p class="cap">999px pill (clamped to half height)</p>
  <div class="r pill">pill</div>
</section>
</main>
</body>
</html>
