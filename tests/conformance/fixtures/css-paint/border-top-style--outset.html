<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="border-top-style; border-top-style: groove; appearance">
<meta name="markswift-themes" content="light,dark">
<title>border-top-style--outset</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.row { display: flex; gap: 10px; align-items: center; }
button { font: inherit; font-size: 14px; line-height: 20px; padding: 4px 10px; }
.radius { border-radius: 6px; }
.fill { background: #cbd5e1; color: #111827; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.t { height: 40px; border: 4px outset; background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 12px; }
.t.in { border-style: inset; }
.black { border-color: #000; }
.grey { border-color: #808080; }
.white { border-color: #fff; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="ua-styled">
  <p class="cap">buttons with an author radius or fill keep the UA outset border</p>
  <div class="row">
    <button type="button" class="radius">Radius</button>
    <button type="button" class="fill">Fill</button>
  </div>
</section>
<section class="v" id="outset">
  <p class="cap">outset 4px: black / grey / white</p>
  <div class="tiles"><div class="t black">black</div><div class="t grey">grey</div><div class="t white">white</div></div>
</section>
<section class="v" id="inset">
  <p class="cap">inset 4px: black / grey / white</p>
  <div class="tiles"><div class="t in black">black</div><div class="t in grey">grey</div><div class="t in white">white</div></div>
</section>
</main>
</body>
</html>
