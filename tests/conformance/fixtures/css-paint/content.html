<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="content; counter-reset; counter-increment; quotes">
<meta name="markswift-themes" content="light,dark">
<title>content</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.icon::before { content: "★"; color: #f59e0b; margin-right: 6px; }
.tag::after { content: " · NEW"; color: #16a34a; font-size: 11px; font-weight: 700; }
.steps { counter-reset: step; list-style: none; padding: 0; margin: 0; }
.steps li { counter-increment: step; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.steps li::before { content: counter(step); width: 24px; height: 24px; border-radius: 50%; background: #2563eb; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
q { quotes: "“" "”"; }
.arrow { display: inline-block; padding: 6px 12px; border-radius: 8px; background: var(--soft); }
.arrow::after { content: " →"; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="pseudo-icon"><p class="cap">::before star glyph, ::after badge text</p><p class="icon tag" style="margin: 0;">Featured article</p></section>
<section class="v" id="pseudo-counter"><p class="cap">counter-reset/increment numbered steps</p><ol class="steps"><li>Install</li><li>Configure</li><li>Ship</li></ol></section>
<section class="v" id="pseudo-quotes"><p class="cap">quotes via open/close quote</p><p style="margin: 0;">She said <q>ship it</q> and left.</p></section>
<section class="v" id="pseudo-arrow"><p class="cap">::after arrow on a link-like chip</p><span class="arrow">Continue</span></section>
</main>
</body>
</html>
