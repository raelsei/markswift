<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="transform; transform: rotate(); transform: scale(); transform: translate(); transform: skew(); transform: matrix(); transform: matrix3d(); transform-origin">
<meta name="markswift-themes" content="light,dark">
<title>transform</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.cell { height: 84px; display: flex; align-items: center; justify-content: center; }
.b { width: 52px; height: 52px; border-radius: 8px; background: #2563eb; color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; }
.rot { transform: rotate(20deg); }
.scl { transform: scale(1.3); }
.tr { transform: translate(12px, -8px); }
.sk { transform: skew(-15deg, 0); }
.mat { transform: matrix(0.9, 0.2, -0.2, 0.9, 0, 4); }
.m3 { transform: matrix3d(0.866, 0, -0.5, 0, 0, 1, 0, 0, 0.5, 0, 0.866, 0, 0, 0, 0, 1); }
.org { transform: rotate(30deg); transform-origin: top left; }
.lbl { font-size: 11px; color: var(--muted); text-align: center; margin: 0; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="tf-a">
  <p class="cap">rotate(20deg) / scale(1.3) / translate(12, -8) / skew(-15deg)</p>
  <div class="tiles">
    <div><div class="cell"><div class="b rot">rot</div></div><p class="lbl">rotate</p></div>
    <div><div class="cell"><div class="b scl">scl</div></div><p class="lbl">scale</p></div>
    <div><div class="cell"><div class="b tr">tr</div></div><p class="lbl">translate</p></div>
    <div><div class="cell"><div class="b sk">sk</div></div><p class="lbl">skew</p></div>
  </div>
</section>
<section class="v" id="tf-b">
  <p class="cap">matrix() shear / matrix3d rotateY 30deg / transform-origin top left / none</p>
  <div class="tiles">
    <div><div class="cell"><div class="b mat">mat</div></div><p class="lbl">matrix</p></div>
    <div><div class="cell"><div class="b m3">3d</div></div><p class="lbl">matrix3d</p></div>
    <div><div class="cell"><div class="b org">org</div></div><p class="lbl">origin</p></div>
    <div><div class="cell"><div class="b">none</div></div><p class="lbl">none</p></div>
  </div>
</section>
</main>
</body>
</html>
