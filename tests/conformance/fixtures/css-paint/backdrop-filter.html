<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="backdrop-filter">
<meta name="markswift-themes" content="light,dark">
<title>backdrop-filter</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.stage { height: 160px; border-radius: 16px; background: linear-gradient(120deg, #f97316, #db2777 50%, #2563eb); position: relative; }
.frost { position: absolute; left: 24px; right: 24px; top: 32px; bottom: 32px; border-radius: 12px; background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(12px) saturate(1.4); -webkit-backdrop-filter: blur(12px) saturate(1.4); border: 1px solid rgba(255, 255, 255, 0.5); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; }
.dark { background: rgba(0, 0, 0, 0.35); }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="frost-light"><p class="cap">frosted white card over a gradient</p><div class="stage"><div class="frost">Frosted</div></div></section>
<section class="v" id="frost-dark"><p class="cap">frosted dark card</p><div class="stage"><div class="frost dark">Frosted dark</div></div></section>
</main>
</body>
</html>
