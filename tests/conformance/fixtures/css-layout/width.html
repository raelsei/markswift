<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="width; height; min-height">
<title>width</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.w-full { width: 100%; }
.w-half { width: 50%; }
.w-fixed { width: 200px; }
.h-fixed { height: 64px; }
.h-half { height: 50%; }
.h-min { min-height: 40px; }
.stage { height: 120px; display: flex; gap: 8px; }
.stack > .b { margin-bottom: 8px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v stack" id="w-class">
  <p class="cap">width from a stylesheet class: 100% / 50% / 200px</p>
  <div class="b w-full">width: 100%</div>
  <div class="b w-half">width: 50%</div>
  <div class="b w-fixed">width: 200px</div>
</section>
<section class="v" id="h-class">
  <p class="cap">height from a class: 64px / 50% of a 120px stage / min-height 40px</p>
  <div class="frame stage"><div class="b h-fixed w-fixed">height 64px</div><div class="b h-half">50%</div><div class="b h-min">min 40</div></div>
</section>
</main>
</body>
</html>
