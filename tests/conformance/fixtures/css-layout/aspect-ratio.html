<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="aspect-ratio">
<title>aspect-ratio</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.row { display: flex; gap: 12px; align-items: flex-start; }
.ar { display: flex; align-items: center; justify-content: center; }
.wide { width: 100%; aspect-ratio: 16 / 9; }
.sq { width: 100px; aspect-ratio: 1; }
.p43 { width: 120px; aspect-ratio: 4 / 3; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="ar-wide"><p class="cap">aspect-ratio: 16 / 9 at full width</p><div class="b ar wide">16:9</div></section>
<section class="v" id="ar-small"><p class="cap">1 / 1 at 100px and 4 / 3 at 120px</p><div class="row"><div class="b ar sq">1:1</div><div class="b ar p43">4:3</div></div></section>
</main>
</body>
</html>
