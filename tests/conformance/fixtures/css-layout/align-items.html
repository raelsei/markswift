<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="align-items; align-items: baseline; align-content">
<title>align-items</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.row { display: flex; gap: 8px; height: 72px; }
.center { align-items: center; }
.end { align-items: flex-end; }
.stretch { align-items: stretch; }
.baseline { align-items: baseline; }
.big { font-size: 24px; line-height: 28px; }
.tall { height: 56px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="ai-center"><p class="cap">align-items: center</p><div class="frame row center"><div class="b tall">Tall</div><div class="b">Short</div><div class="b big">Big</div></div></section>
<section class="v" id="ai-end"><p class="cap">align-items: flex-end</p><div class="frame row end"><div class="b tall">Tall</div><div class="b">Short</div><div class="b big">Big</div></div></section>
<section class="v" id="ai-stretch"><p class="cap">align-items: stretch</p><div class="frame row stretch"><div class="b">Fills</div><div class="b">Fills</div><div class="b big">Fills</div></div></section>
<section class="v" id="ai-baseline"><p class="cap">align-items: baseline</p><div class="frame row baseline"><div class="b">Base 13px</div><div class="b big">Base 24px</div><div class="b">Base</div></div></section>
</main>
</body>
</html>
