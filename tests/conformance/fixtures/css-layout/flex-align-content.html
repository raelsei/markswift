<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="flex-wrap: wrap; align-content; space-between; space-around; space-evenly">
<meta name="markswift-reflow" content="native">
<title>flex-align-content</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; --b2: #16a34a; --b3: #db2777; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; }
.b2 { background: var(--b2); } .b3 { background: var(--b3); }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.tile { width: 100px; height: 36px; }
.wrap-box { display: flex; flex-wrap: wrap; gap: 8px; height: 130px; }
.ac-start { align-content: flex-start; }
.ac-center { align-content: center; }
.ac-end { align-content: flex-end; }
.ac-between { align-content: space-between; }
.ac-around { align-content: space-around; }
.ac-evenly { align-content: space-evenly; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="ac-center-sec">
  <p class="cap">wrap align-content: center in 130px box</p>
  <div class="frame wrap-box ac-center">
    <div class="b tile">1</div><div class="b tile">2</div><div class="b tile">3</div>
    <div class="b b2 tile">4</div><div class="b b2 tile">5</div>
  </div>
</section>
<section class="v" id="ac-between-sec">
  <p class="cap">wrap align-content: space-between</p>
  <div class="frame wrap-box ac-between">
    <div class="b tile">A</div><div class="b tile">B</div><div class="b tile">C</div>
    <div class="b b3 tile">D</div><div class="b b3 tile">E</div>
  </div>
</section>
<section class="v" id="ac-around-sec">
  <p class="cap">wrap align-content: space-around</p>
  <div class="frame wrap-box ac-around">
    <div class="b tile">X</div><div class="b tile">Y</div><div class="b tile">Z</div>
    <div class="b b2 tile">W</div>
  </div>
</section>
</main>
</body>
</html>
