<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="row-gap; column-gap">
<title>row-gap</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.row { display: flex; column-gap: 16px; }
.col { display: flex; flex-direction: column; row-gap: 12px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); row-gap: 6px; column-gap: 20px; }
.b { text-align: center; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="gap-col"><p class="cap">flex row, column-gap: 16px</p><div class="frame row"><div class="b">A</div><div class="b">B</div><div class="b">C</div></div></section>
<section class="v" id="gap-row"><p class="cap">flex column, row-gap: 12px</p><div class="frame col"><div class="b">A</div><div class="b">B</div><div class="b">C</div></div></section>
<section class="v" id="gap-grid"><p class="cap">grid, row-gap 6px / column-gap 20px</p><div class="frame grid"><div class="b">1</div><div class="b">2</div><div class="b">3</div><div class="b">4</div><div class="b">5</div><div class="b">6</div></div></section>
</main>
</body>
</html>
