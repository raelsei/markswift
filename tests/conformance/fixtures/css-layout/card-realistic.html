<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="display: flex; display: grid; flex-wrap">
<meta name="markswift-reflow" content="pinned">
<title>card-realistic</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; --b2:#16a34a; --b3:#db2777; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; }
.b2 { background: var(--b2); } .b3 { background: var(--b3); }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.head { display: flex; align-items: center; gap: 12px; }
.avatar { width: 40px; height: 40px; border-radius: 999px; background: var(--soft); flex-shrink: 0; }
.who { flex: 1; min-width: 0; }
.name { font-weight: 600; margin: 0; }
.mail { color: var(--muted); font-size: 13px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { background: var(--fg); color: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: var(--bg); border-radius: 8px; padding: 8px; }
.stat b { display: block; font-size: 18px; line-height: 24px; }
.foot { display: flex; justify-content: space-between; align-items: center; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { background: var(--soft); color: var(--accent); border-radius: 999px; padding: 2px 8px; font-size: 12px; }
@media (min-width: 600px) { .stats { grid-template-columns: repeat(4, 1fr); } }

</style></head><body><main data-markswift-root>

<div class="card">
 <div class="head"><div class="avatar"></div><div class="who"><p class="name">Olivia Martin</p><p class="mail">olivia.martin@example-company-domain.com</p></div><div class="btn">Follow</div></div>
 <div class="stats"><div class="stat">Posts<b>128</b></div><div class="stat">Followers<b>3.2k</b></div><div class="stat">Following<b>214</b></div><div class="stat">Likes<b>9.8k</b></div></div>
 <div class="tags"><span class="tag">Design</span><span class="tag">Swift</span><span class="tag">Product</span><span class="tag">Typography</span><span class="tag">Open source</span></div>
 <div class="foot"><span style="color:var(--muted);font-size:13px">Joined 2021</span><div class="btn">Message</div></div>
</div>

</main></body></html>
