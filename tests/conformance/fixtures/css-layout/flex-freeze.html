<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="flex-grow; flex-shrink; flex-basis">
<meta name="markswift-reflow" content="native">
<title>flex-freeze</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; --b2:#16a34a; --b3:#db2777; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; height: 40px; }
.b2 { background: var(--b2); } .b3 { background: var(--b3); }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }

.row { display: flex; gap: 8px; }
.grow .b { flex: 1 1 0%; } .grow .b2 { flex-grow: 2; max-width: 130px; }
.shrink .b { flex: 0 1 160px; } .shrink .b2 { flex-shrink: 2; min-width: 88px; }
.partial .b { flex: 0.25 1 40px; }
.pct .q { flex: 0 1 25%; padding: 8px 0; text-align: center; } .pct .rest { flex: 1 1 0px; }

</style></head><body><main data-markswift-root>

<section class="v"><p class="cap">flex 1 1 0%, middle grow 2 with max-width 130px</p><div class="frame row grow"><div class="b">one</div><div class="b b2">two</div><div class="b b3">three</div></div></section>
<section class="v"><p class="cap">flex 0 1 160px shrinks, middle shrink 2 stops at min-width 88px</p><div class="frame row shrink"><div class="b">A</div><div class="b b2">B</div><div class="b b3">C</div></div></section>
<section class="v"><p class="cap">flex 0.25 1 40px (grow sum 0.75)</p><div class="frame row partial"><div class="b">a</div><div class="b b2">b</div><div class="b b3">c</div></div></section>
<section class="v"><p class="cap">flex 0 1 25% beside flex 1</p><div class="frame row pct"><div class="b q">25%</div><div class="b b2 rest">rest</div></div></section>

</main></body></html>
