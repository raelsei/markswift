<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="flex-direction: column; definite height; flex-grow; flex-shrink">
<meta name="markswift-reflow" content="native">
<title>flex-column</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; --b2: #16a34a; --b3: #db2777; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; }
.b2 { background: var(--b2); } .b3 { background: var(--b3); }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.col-grow { display: flex; flex-direction: column; height: 180px; gap: 8px; }
.col-shrink { display: flex; flex-direction: column; height: 160px; gap: 8px; }
.g1 { flex: 1 1 0px; }
.g2 { flex: 2 1 0px; }
.s1 { flex: 0 1 80px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="column-grow">
  <p class="cap">column flex 1 : 2 in definite 180px height</p>
  <div class="frame col-grow">
    <div class="b g1">header (grow 1)</div>
    <div class="b b2 g2">body (grow 2)</div>
  </div>
</section>
<section class="v" id="column-shrink">
  <p class="cap">three 80px items shrunk to fit 160px</p>
  <div class="frame col-shrink">
    <div class="b s1">top item</div>
    <div class="b b2 s1">middle item</div>
    <div class="b b3 s1">bottom item</div>
  </div>
</section>
</main>
</body>
</html>
