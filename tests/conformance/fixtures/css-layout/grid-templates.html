<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="grid-template-columns">
<meta name="markswift-reflow" content="native">
<title>grid-templates</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; --b2:#16a34a; --b3:#db2777; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; }
.b2 { background: var(--b2); } .b3 { background: var(--b3); }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }

.g { display: grid; gap: 8px; }
.t12 { grid-template-columns: 1fr 2fr; }
.tfix { grid-template-columns: 100px 1fr; }
.tfill { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
.taaa { grid-template-columns: auto 1fr auto; }
.t3 { grid-template-columns: repeat(3, 1fr); }
.b { text-align: center; }

</style></head><body><main data-markswift-root>

<section class="v"><p class="cap">1fr 2fr</p><div class="frame g t12"><div class="b">A</div><div class="b b2">B</div><div class="b">C</div><div class="b b2">D</div></div></section>
<section class="v"><p class="cap">100px 1fr</p><div class="frame g tfix"><div class="b">Label</div><div class="b b2">Value</div><div class="b">Label</div><div class="b b2">Value</div></div></section>
<section class="v"><p class="cap">repeat(auto-fill, minmax(100px, 1fr))</p><div class="frame g tfill"><div class="b">1</div><div class="b b2">2</div><div class="b b3">3</div><div class="b">4</div><div class="b b2">5</div><div class="b b3">6</div></div></section>
<section class="v"><p class="cap">auto 1fr auto</p><div class="frame g taaa"><div class="b">Icon</div><div class="b b2">Title text</div><div class="b b3">9:41</div></div></section>
<section class="v"><p class="cap">repeat(3, 1fr)</p><div class="frame g t3"><div class="b">1</div><div class="b b2">2</div><div class="b b3">3</div></div></section>

</main></body></html>
