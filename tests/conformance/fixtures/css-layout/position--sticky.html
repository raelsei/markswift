<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="position: sticky; top">
<title>position--sticky</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.list { height: 200px; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.head { position: sticky; top: 0; background: var(--soft); color: var(--fg); padding: 6px 12px; font-weight: 600; font-size: 13px; }
.item { padding: 8px 12px; border-bottom: 1px solid var(--line); }
.top { position: sticky; top: 0; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="sticky-root">
  <p class="cap">sticky top: 0 at rest (no scroll)</p>
  <div class="b top">Sticky toolbar</div>
</section>
<section class="v" id="sticky-list">
  <p class="cap">sticky group headers inside an overflow-y: auto list</p>
  <div class="list">
    <div class="head">A</div>
    <div class="item">Alder</div><div class="item">Ash</div><div class="item">Aspen</div>
    <div class="head">B</div>
    <div class="item">Beech</div><div class="item">Birch</div><div class="item">Boxwood</div>
    <div class="head">C</div>
    <div class="item">Cedar</div><div class="item">Cherry</div>
  </div>
</section>
</main>
</body>
</html>
