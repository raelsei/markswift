<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="display: contents">
<title>display--contents</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.row { display: flex; gap: 8px; }
.wrap { display: contents; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="contents-flex">
  <p class="cap">display: contents wrapper — its children are flex items</p>
  <div class="frame row"><div class="b">Direct</div><div class="wrap"><div class="b">From wrapper 1</div><div class="b">From wrapper 2</div></div><div class="b">Direct</div></div>
</section>
<section class="v" id="contents-nested">
  <p class="cap">nested contents wrappers</p>
  <div class="frame row"><div class="wrap"><div class="wrap"><div class="b">Deep A</div></div><div class="b">Deep B</div></div></div>
</section>
</main>
</body>
</html>
