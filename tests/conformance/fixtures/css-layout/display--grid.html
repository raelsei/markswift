<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="display: grid; grid-template-columns; grid-template-columns: 120px 120px; grid-template-columns: repeat(2, 1fr); grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); grid-template-rows; grid-auto-flow: row">
<meta name="markswift-reflow" content="pinned">
<title>display--grid</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.g { display: grid; gap: 8px; }
.fixed { grid-template-columns: 120px 120px; grid-template-rows: 40px 40px; }
.halves { grid-template-columns: repeat(2, 1fr); }
.fit { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); grid-auto-flow: row; }
.b { text-align: center; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="grid-fixed">
  <p class="cap">grid-template-columns: 120px 120px; rows 40px 40px</p>
  <div class="frame g fixed"><div class="b">1</div><div class="b">2</div><div class="b">3</div><div class="b">4</div></div>
</section>
<section class="v" id="grid-halves">
  <p class="cap">repeat(2, 1fr)</p>
  <div class="frame g halves"><div class="b">A</div><div class="b">B</div><div class="b">C</div><div class="b">D</div></div>
</section>
<section class="v" id="grid-fit">
  <p class="cap">repeat(auto-fit, minmax(160px, 1fr)) — two columns at 361px</p>
  <div class="frame g fit"><div class="b">Fit 1</div><div class="b">Fit 2</div><div class="b">Fit 3</div><div class="b">Fit 4</div><div class="b">Fit 5</div></div>
</section>
</main>
</body>
</html>
