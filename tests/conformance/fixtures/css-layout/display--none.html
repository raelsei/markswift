<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="display: none; display: block; display: inline-block">
<title>display--none</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.row { display: flex; gap: 8px; }
.gone { display: none; }
.blk { display: block; margin-bottom: 8px; }
.inl { display: inline-block; margin-right: 8px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="none-flex">
  <p class="cap">flex row where the second item is display: none</p>
  <div class="frame row"><div class="b">One</div><div class="b gone">Gone</div><div class="b">Three</div></div>
</section>
<section class="v" id="none-block">
  <p class="cap">block flow with a hidden block between two blocks</p>
  <div class="frame"><div class="b blk">Block A</div><div class="b blk gone">Hidden block</div><div class="b blk">Block B</div></div>
</section>
<section class="v" id="inline-block">
  <p class="cap">inline-block chips, one hidden</p>
  <div class="frame"><span class="b inl">Chip 1</span><span class="b inl gone">Chip 2</span><span class="b inl">Chip 3</span></div>
</section>
</main>
</body>
</html>
