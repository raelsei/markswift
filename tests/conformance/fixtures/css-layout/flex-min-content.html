<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="min-width: auto; breakable min-content; flex-shrink">
<!-- pinned: widths reflow (min-content probes), but captured text heights stay floors and macOS Text breaks lines differently -->
<meta name="markswift-reflow" content="pinned">
<title>flex-min-content</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; --b2: #16a34a; --b3: #db2777; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; }
.b2 { background: var(--b2); } .b3 { background: var(--b3); }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.row { display: flex; gap: 8px; }
.item-text { flex: 0 1 180px; }
.item-fixed { flex: 0 1 140px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="breakable-shrink">
  <p class="cap">breakable min-content: text wraps as row shrinks</p>
  <div class="frame row">
    <div class="b item-text">Responsive Headline Content</div>
    <div class="b b2 item-fixed">Sidebar Action</div>
  </div>
</section>
<section class="v" id="multi-shrink">
  <p class="cap">three shrinking items with breakable text</p>
  <div class="frame row">
    <div class="b item-text">Navigation Links</div>
    <div class="b b2 item-text">Product Overview</div>
    <div class="b b3 item-text">User Profile</div>
  </div>
</section>
</main>
</body>
</html>
