<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="overflow-x; overflow-x: auto; overflow-x: hidden; overflow-x: scroll">
<title>overflow-x--auto</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.rail { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.rail.hidden { overflow-x: hidden; }
.rail.scroll { overflow-x: scroll; }
.card { flex: 0 0 200px; height: 96px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="ox-auto">
  <p class="cap">overflow-x: auto carousel (200px cards)</p>
  <div class="rail"><div class="card">Card 1</div><div class="card">Card 2</div><div class="card">Card 3</div><div class="card">Card 4</div></div>
</section>
<section class="v" id="ox-hidden">
  <p class="cap">overflow-x: hidden (clipped)</p>
  <div class="rail hidden"><div class="card">Card 1</div><div class="card">Card 2</div><div class="card">Card 3</div></div>
</section>
<section class="v" id="ox-scroll">
  <p class="cap">overflow-x: scroll</p>
  <div class="rail scroll"><div class="card">Card 1</div><div class="card">Card 2</div><div class="card">Card 3</div></div>
</section>
</main>
</body>
</html>
