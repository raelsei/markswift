<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="position: fixed; top; left; right">
<title>position--fixed</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.bar { position: fixed; top: 0; left: 0; right: 0; height: 48px; background: var(--accent); color: var(--accent-fg); display: flex; align-items: center; padding: 0 16px; font-weight: 600; }
.fab { position: fixed; top: 180px; right: 16px; width: 48px; height: 48px; border-radius: 50%; background: #dc2626; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.spacer { height: 48px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
</style>
</head>
<body>
<main data-markswift-root>
<div class="bar" id="fixed-bar">Fixed header</div>
<div class="spacer"></div>
<section class="v" id="fixed-content">
  <p class="cap">content under a fixed header and a fixed action button</p>
  <div class="card">Card one</div>
  <div class="card">Card two</div>
  <div class="card">Card three</div>
</section>
<div class="fab" id="fixed-fab">+</div>
</main>
</body>
</html>
