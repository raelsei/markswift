<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="display; display: flex; flex-direction; flex-grow; flex-shrink; flex-basis; align-self">
<meta name="markswift-reflow" content="native">
<title>display--flex</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.row { display: flex; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex-grow: 1; }
.basis { flex-basis: 120px; flex-shrink: 0; }
.self-end { align-self: flex-end; }
.tall { height: 48px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="flex-row">
  <p class="cap">flex row, middle grows</p>
  <div class="frame row"><div class="b">One</div><div class="b grow">Two grows</div><div class="b">Three</div></div>
</section>
<section class="v" id="flex-column">
  <p class="cap">flex-direction: column</p>
  <div class="frame col"><div class="b">First</div><div class="b">Second</div><div class="b">Third</div></div>
</section>
<section class="v" id="flex-nested">
  <p class="cap">nested: row containing a column</p>
  <div class="frame row">
    <div class="b basis tall">basis 120</div>
    <div class="col grow"><div class="b">Stacked A</div><div class="b">Stacked B</div></div>
  </div>
</section>
<section class="v" id="flex-self">
  <p class="cap">align-self: flex-end on the last item</p>
  <div class="frame row"><div class="b tall">Tall</div><div class="b">Top</div><div class="b self-end">End</div></div>
</section>
</main>
</body>
</html>
