<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="grid-column-start; grid-column-end; grid-row-start; grid-row-end; grid-template-areas; grid-auto-rows; justify-self; justify-items">
<meta name="markswift-reflow" content="native">
<meta name="markswift-themes" content="light,dark">
<title>grid-placement</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; --b2:#16a34a; --b3:#db2777; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --fg: #e5e7eb; --muted: #9ca3af; --card: #111827; --line: #374151; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; text-align: center; }
.b2 { background: var(--b2); } .b3 { background: var(--b3); }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }

.g { display: grid; gap: 8px; }
.span { grid-template-columns: repeat(3, 1fr); }
.span .wide { grid-column: span 2; }
.areas { grid-template-columns: 96px 1fr; grid-template-areas: "head head" "side main"; }
.areas .head { grid-area: head; } .areas .side { grid-area: side; } .areas .main { grid-area: main; }
.holes { grid-template-columns: repeat(3, 1fr); }
.holes .c3 { grid-column: 3; } .holes .r2 { grid-column: 1; grid-row: 2; }
.just { grid-template-columns: 1fr 1fr; justify-items: start; }
.just .end { justify-self: end; } .just .mid { justify-self: center; } .just .str { justify-self: stretch; }
.rows { grid-template-columns: 1fr auto; grid-template-rows: auto auto; grid-auto-rows: 36px; }
.rows .act { grid-column-start: 2; grid-row: 1 / span 2; justify-self: end; }
</style></head><body><main data-markswift-root>

<section class="v"><p class="cap">grid-column: span 2</p><div class="frame g span"><div class="b wide">Wide</div><div class="b b2">2</div><div class="b b3">3</div><div class="b">4</div><div class="b b2">5</div></div></section>
<section class="v"><p class="cap">grid-template-areas</p><div class="frame g areas"><div class="b b2 main">Main</div><div class="b side">Side</div><div class="b b3 head">Head</div></div></section>
<section class="v"><p class="cap">holes</p><div class="frame g holes"><div class="b c3">C3</div><div class="b b2 r2">R2</div><div class="b b3">Auto</div></div></section>
<section class="v"><p class="cap">justify-self</p><div class="frame g just"><div class="b">Start</div><div class="b b2 end">End</div><div class="b b3 mid">Center</div><div class="b str">Stretch</div></div></section>
<section class="v"><p class="cap">grid-auto-rows and a row span</p><div class="frame g rows"><div class="b">Title</div><div class="b b2">Description</div><div class="b b3 act">Action</div><div class="b">Implicit</div></div></section>

</main></body></html>
