<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="display: flex; flex-direction; grid-template-columns">
<meta name="markswift-breakpoints" content="390,768,1210">
<title>media-query-bands</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; --b2:#16a34a; --b3:#db2777; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.b { box-sizing: border-box; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 16px; }
.b2 { background: var(--b2); } .b3 { background: var(--b3); }
.frame { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }

.split { display: flex; flex-direction: column; gap: 8px; }
.only-wide { display: none; }
.cols { display: grid; grid-template-columns: 1fr; gap: 8px; }
.title { font-size: 18px; line-height: 24px; font-weight: 600; margin: 0; }
@media (min-width: 600px) {
  .split { flex-direction: row; }
  .split > * { flex: 1; }
  .only-wide { display: block; }
  .cols { grid-template-columns: repeat(3, 1fr); }
  .title { font-size: 24px; line-height: 32px; }
}

</style></head><body><main data-markswift-root>

<section class="v"><p class="title">Responsive section</p></section>
<section class="v"><p class="cap">column → row at 600px</p><div class="frame split"><div class="b">First panel</div><div class="b b2">Second panel</div></div></section>
<section class="v"><p class="cap">1 → 3 columns at 600px</p><div class="frame cols"><div class="b">Alpha</div><div class="b b2">Beta</div><div class="b b3">Gamma</div></div></section>
<section class="v"><p class="cap">wide-only banner</p><div class="frame"><div class="b">Always</div><div class="b b3 only-wide" style="margin-top:8px">Only at ≥600px</div></div></section>

</main></body></html>
