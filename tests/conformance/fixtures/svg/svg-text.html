<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="svg:text; svg:tspan; text-anchor; dominant-baseline">
<meta name="markswift-themes" content="light,dark">
<title>svg-text</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.row { display: flex; gap: 16px; align-items: center; }
svg { display: block; }
.lbl { font-size: 11px; color: var(--muted); text-align: center; margin: 4px 0 0; }
svg { width: 100%; height: 60px; }
text { font-family: system-ui; font-size: 16px; fill: var(--fg); }
.muted { fill: var(--muted); }
.guide { stroke: var(--line); }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="anchors">
  <p class="cap">text-anchor start / middle / end on one line</p>
  <svg viewBox="0 0 361 60"><line class="guide" x1="0" y1="30" x2="361" y2="30"/><text x="8" y="26" text-anchor="start">Start</text><text x="180" y="26" text-anchor="middle">Middle</text><text x="353" y="26" text-anchor="end">End</text><text class="muted" x="180" y="50" text-anchor="middle" dominant-baseline="middle" font-size="12">baseline middle</text></svg>
</section>
<section class="v" id="tspans">
  <p class="cap">tspan runs with bold and colour</p>
  <svg viewBox="0 0 361 60"><text x="8" y="36" font-size="22"><tspan font-weight="700">42</tspan><tspan class="muted" font-size="14"> items</tspan><tspan fill="#16a34a" dx="12">+8%</tspan></text></svg>
</section>
</main>
</body>
</html>
