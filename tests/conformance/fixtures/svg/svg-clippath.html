<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="svg:clipPath; clip-rule; svg:mask">
<meta name="markswift-themes" content="light,dark">
<title>svg-clippath</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.row { display: flex; gap: 16px; align-items: center; }
svg { display: block; }
.lbl { font-size: 11px; color: var(--muted); text-align: center; margin: 4px 0 0; }
.s { width: 100px; height: 80px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="clips">
  <p class="cap">clipPath circle / clipPath star with clip-rule evenodd / mask gradient</p>
  <div class="row">
    <svg class="s" viewBox="0 0 100 80"><defs><clipPath id="cp1"><circle cx="50" cy="40" r="32"/></clipPath></defs><rect width="100" height="80" fill="#2563eb" clip-path="url(#cp1)"/><rect x="0" y="40" width="100" height="40" fill="#db2777" clip-path="url(#cp1)"/></svg>
    <svg class="s" viewBox="0 0 100 80"><defs><clipPath id="cp2" clip-rule="evenodd"><path d="M50 4l14 30 32 3-24 22 7 32-29-17-29 17 7-32L4 37l32-3z" clip-rule="evenodd"/></clipPath></defs><rect width="100" height="80" fill="#f59e0b" clip-path="url(#cp2)"/></svg>
    <svg class="s" viewBox="0 0 100 80"><defs><linearGradient id="mg" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient><mask id="m1"><rect width="100" height="80" fill="url(#mg)"/></mask></defs><rect width="100" height="80" rx="10" fill="#16a34a" mask="url(#m1)"/></svg>
  </div>
</section>
</main>
</body>
</html>
