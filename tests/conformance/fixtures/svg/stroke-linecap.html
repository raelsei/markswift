<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="stroke-linecap; stroke-linejoin; stroke-miterlimit; svg:polyline">
<meta name="markswift-themes" content="light,dark">
<title>stroke-linecap</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.row { display: flex; gap: 16px; align-items: center; }
svg { display: block; }
.lbl { font-size: 11px; color: var(--muted); text-align: center; margin: 4px 0 0; }
.s { width: 100px; height: 60px; }
.st { fill: none; stroke: var(--accent); stroke-width: 12; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="caps">
  <p class="cap">stroke-linecap butt / round / square</p>
  <div class="row">
    <svg class="s" viewBox="0 0 100 60"><line class="st" x1="15" y1="30" x2="85" y2="30" stroke-linecap="butt"/></svg>
    <svg class="s" viewBox="0 0 100 60"><line class="st" x1="15" y1="30" x2="85" y2="30" stroke-linecap="round"/></svg>
    <svg class="s" viewBox="0 0 100 60"><line class="st" x1="15" y1="30" x2="85" y2="30" stroke-linecap="square"/></svg>
  </div>
</section>
<section class="v" id="joins">
  <p class="cap">stroke-linejoin miter / round / bevel on a chevron</p>
  <div class="row">
    <svg class="s" viewBox="0 0 100 60"><polyline class="st" points="15,50 50,12 85,50" stroke-linejoin="miter" stroke-miterlimit="10"/></svg>
    <svg class="s" viewBox="0 0 100 60"><polyline class="st" points="15,50 50,12 85,50" stroke-linejoin="round"/></svg>
    <svg class="s" viewBox="0 0 100 60"><polyline class="st" points="15,50 50,12 85,50" stroke-linejoin="bevel"/></svg>
  </div>
</section>
</main>
</body>
</html>
