<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="fill-rule; svg:polygon; svg:path">
<meta name="markswift-themes" content="light,dark">
<title>fill-rule</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.row { display: flex; gap: 16px; align-items: center; }
svg { display: block; }
.lbl { font-size: 11px; color: var(--muted); text-align: center; margin: 4px 0 0; }
.s { width: 90px; height: 90px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="rules">
  <p class="cap">self-intersecting star: nonzero (filled) vs evenodd (hollow centre); ring path evenodd</p>
  <div class="row">
    <svg class="s" viewBox="0 0 100 100"><polygon points="50,5 20,95 95,35 5,35 80,95" fill="#2563eb" fill-rule="nonzero"/></svg>
    <svg class="s" viewBox="0 0 100 100"><polygon points="50,5 20,95 95,35 5,35 80,95" fill="#2563eb" fill-rule="evenodd"/></svg>
    <svg class="s" viewBox="0 0 100 100"><path d="M50 5a45 45 0 1 0 0.1 0z M50 25a25 25 0 1 0 0.1 0z" fill="#db2777" fill-rule="evenodd"/></svg>
  </div>
</section>
</main>
</body>
</html>
