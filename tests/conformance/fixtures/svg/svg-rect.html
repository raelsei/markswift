<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="svg:rect; x; y; rx; ry; svg:line; svg:polygon; svg:polyline">
<meta name="markswift-themes" content="light,dark">
<title>svg-rect</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.row { display: flex; gap: 16px; align-items: center; }
svg { display: block; }
.lbl { font-size: 11px; color: var(--muted); text-align: center; margin: 4px 0 0; }
.s { width: 80px; height: 60px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="rects">
  <p class="cap">rect / rounded rx=12 / elliptical rx=20 ry=8 / stroked at x=10 y=10</p>
  <div class="row">
    <svg class="s" viewBox="0 0 80 60"><rect width="80" height="60" fill="#2563eb"/></svg>
    <svg class="s" viewBox="0 0 80 60"><rect width="80" height="60" rx="12" fill="#16a34a"/></svg>
    <svg class="s" viewBox="0 0 80 60"><rect width="80" height="60" rx="20" ry="8" fill="#db2777"/></svg>
    <svg class="s" viewBox="0 0 80 60"><rect x="10" y="10" width="60" height="40" rx="6" fill="none" stroke="#f59e0b" stroke-width="3"/></svg>
  </div>
</section>
<section class="v" id="basic-shapes">
  <p class="cap">line / polygon triangle / polyline zigzag</p>
  <div class="row">
    <svg class="s" viewBox="0 0 80 60"><line x1="8" y1="52" x2="72" y2="8" stroke="#2563eb" stroke-width="4"/></svg>
    <svg class="s" viewBox="0 0 80 60"><polygon points="40,6 74,54 6,54" fill="#9333ea"/></svg>
    <svg class="s" viewBox="0 0 80 60"><polyline points="6,50 22,14 38,50 54,14 74,50" fill="none" stroke="#dc2626" stroke-width="4"/></svg>
  </div>
</section>
</main>
</body>
</html>
