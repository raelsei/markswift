<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="svg:g">
<meta name="markswift-themes" content="light,dark">
<title>svg-g</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.row { display: flex; gap: 16px; align-items: center; }
svg { display: block; }
.lbl { font-size: 11px; color: var(--muted); text-align: center; margin: 4px 0 0; }
.s { width: 100px; height: 80px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="groups">
  <p class="cap">g with inherited fill / translate(20, 10) / rotate(30 50 40)</p>
  <div class="row">
    <svg class="s" viewBox="0 0 100 80"><g fill="#2563eb"><rect x="10" y="10" width="30" height="30"/><circle cx="70" cy="50" r="15"/></g></svg>
    <svg class="s" viewBox="0 0 100 80"><g transform="translate(20, 10)" fill="#16a34a"><rect width="30" height="30"/><circle cx="55" cy="40" r="15"/></g></svg>
    <svg class="s" viewBox="0 0 100 80"><g transform="rotate(30 50 40)" fill="#db2777"><rect x="25" y="25" width="50" height="30" rx="4"/></g></svg>
  </div>
</section>
</main>
</body>
</html>
