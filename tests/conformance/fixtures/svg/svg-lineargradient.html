<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="svg:linearGradient; svg:radialGradient; svg:stop; svg:defs; stop-color; stop-opacity">
<meta name="markswift-themes" content="light,dark">
<title>svg-lineargradient</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.row { display: flex; gap: 16px; align-items: center; }
svg { display: block; }
.lbl { font-size: 11px; color: var(--muted); text-align: center; margin: 4px 0 0; }
.s { width: 100px; height: 70px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="gradients">
  <p class="cap">linearGradient horizontal / diagonal 3 stops / radialGradient with stop-opacity</p>
  <div class="row">
    <svg class="s" viewBox="0 0 100 70">
      <defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#db2777"/></linearGradient></defs>
      <rect width="100" height="70" rx="10" fill="url(#lg1)"/>
    </svg>
    <svg class="s" viewBox="0 0 100 70">
      <defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="50%" stop-color="#facc15"/><stop offset="100%" stop-color="#22c55e"/></linearGradient></defs>
      <rect width="100" height="70" rx="10" fill="url(#lg2)"/>
    </svg>
    <svg class="s" viewBox="0 0 100 70">
      <defs><radialGradient id="rg1" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#b45309" stop-opacity="0.2"/></radialGradient></defs>
      <rect width="100" height="70" rx="10" fill="url(#rg1)"/>
    </svg>
  </div>
</section>
</main>
</body>
</html>
