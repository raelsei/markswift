<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="svg; svg:svg; svg:path; d; fill; stroke; stroke-width; fill-opacity; stroke-opacity">
<meta name="markswift-themes" content="light,dark">
<title>svg-path</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.row { display: flex; gap: 16px; align-items: center; }
svg { display: block; }
.lbl { font-size: 11px; color: var(--muted); text-align: center; margin: 4px 0 0; }
.ic { width: 40px; height: 40px; }
.stroke { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.solid { fill: var(--accent); }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="icons">
  <p class="cap">four path icons: stroked heart, home; filled star, bolt</p>
  <div class="row">
    <svg class="ic stroke" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
    <svg class="ic stroke" viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v11a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2z"/></svg>
    <svg class="ic solid" viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
    <svg class="ic solid" viewBox="0 0 24 24"><path d="M13 2L3 14h8l-1 8 10-12h-8z"/></svg>
  </div>
</section>
<section class="v" id="opacity">
  <p class="cap">fill-opacity 0.4 / stroke-opacity 0.4 / inline fill + stroke attributes</p>
  <div class="row">
    <svg class="ic" viewBox="0 0 24 24"><path d="M4 4h16v16H4z" fill="#2563eb" fill-opacity="0.4"/></svg>
    <svg class="ic" viewBox="0 0 24 24"><path d="M4 4h16v16H4z" fill="none" stroke="#dc2626" stroke-width="4" stroke-opacity="0.4"/></svg>
    <svg class="ic" viewBox="0 0 24 24"><path d="M12 3l9 18H3z" fill="#fde047" stroke="#b45309" stroke-width="1.5"/></svg>
  </div>
</section>
</main>
</body>
</html>
