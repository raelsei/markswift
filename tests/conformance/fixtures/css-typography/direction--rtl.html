<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="direction; direction: rtl; unicode-bidi">
<meta name="markswift-themes" content="light,dark">
<title>direction--rtl</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
p.s { margin: 0 0 8px; }
p.s:last-child { margin-bottom: 0; }
.rtl { direction: rtl; }
.row { display: flex; gap: 8px; }
.b { background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.iso { unicode-bidi: isolate; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="ltr-row"><p class="cap">direction: ltr flex row and text</p><div class="row"><span class="b">1</span><span class="b">2</span><span class="b">3</span></div><p class="s">Left-to-right paragraph.</p></section>
<section class="v rtl" id="rtl-row"><p class="cap">direction: rtl — items and text start from the right</p><div class="row"><span class="b">1</span><span class="b">2</span><span class="b">3</span></div><p class="s">Right-to-left paragraph with <span class="iso">isolated LTR run</span> inside.</p></section>
</main>
</body>
</html>
