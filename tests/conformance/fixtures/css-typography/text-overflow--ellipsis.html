<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="text-overflow; text-overflow: ellipsis; text-overflow: clip; text-wrap-mode: nowrap">
<meta name="markswift-themes" content="light,dark">
<title>text-overflow--ellipsis</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
p.s { margin: 0 0 8px; }
p.s:last-child { margin-bottom: 0; }
p.s { white-space: nowrap; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.ell { text-overflow: ellipsis; }
.clip { text-overflow: clip; }
.narrow { width: 180px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="ellipsis"><p class="cap">nowrap + ellipsis, full width and 180px</p><p class="s ell">A single line that is far too long to fit inside the available width</p><p class="s ell narrow">A single line that is far too long</p></section>
<section class="v" id="clip"><p class="cap">text-overflow: clip</p><p class="s clip">A single line that is far too long to fit inside the available width</p></section>
</main>
</body>
</html>
