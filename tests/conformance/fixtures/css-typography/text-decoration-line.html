<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="text-decoration; text-decoration-line; text-decoration-line: underline; text-decoration-line: line-through; text-decoration-line: overline; text-decoration-style; text-decoration-style: wavy; text-decoration-style: double; text-decoration-color; text-decoration-thickness; text-underline-offset">
<meta name="markswift-themes" content="light,dark">
<title>text-decoration-line</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
p.s { margin: 0 0 8px; }
p.s:last-child { margin-bottom: 0; }
.u { text-decoration-line: underline; }
.s2 { text-decoration-line: line-through; }
.o { text-decoration-line: overline; }
.wavy { text-decoration: underline wavy #db2777; }
.dbl { text-decoration: underline double #2563eb; }
.thick { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 4px; text-decoration-color: #16a34a; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="lines">
  <p class="cap">underline / line-through / overline</p>
  <p class="s u">Underlined text</p>
  <p class="s s2">Struck through text</p>
  <p class="s o">Overlined text</p>
</section>
<section class="v" id="styles">
  <p class="cap">wavy pink / double blue / 3px green offset 4px</p>
  <p class="s wavy">Wavy underline</p>
  <p class="s dbl">Double underline</p>
  <p class="s thick">Thick offset underline</p>
</section>
</main>
</body>
</html>
