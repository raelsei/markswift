<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="font-family; font-family: system-ui; font-family: ui-monospace; font-family: ui-rounded; font-family: ui-serif">
<meta name="markswift-themes" content="light,dark">
<title>font-family</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
p.s { margin: 0 0 8px; }
p.s:last-child { margin-bottom: 0; }
.sys { font-family: system-ui; }
.mono { font-family: ui-monospace, monospace; }
.round { font-family: ui-rounded, system-ui; }
.serif { font-family: ui-serif, serif; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="families">
  <p class="cap">system-ui / ui-monospace / ui-rounded / ui-serif</p>
  <p class="s sys">system-ui — The quick brown fox jumps over 12 lazy dogs.</p>
  <p class="s mono">ui-monospace — The quick brown fox jumps over 12 lazy dogs.</p>
  <p class="s round">ui-rounded — The quick brown fox jumps over 12 lazy dogs.</p>
  <p class="s serif">ui-serif — The quick brown fox jumps over 12 lazy dogs.</p>
</section>
</main>
</body>
</html>
