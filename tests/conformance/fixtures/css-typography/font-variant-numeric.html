<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="font-variant-numeric; font-variant-numeric: tabular-nums">
<meta name="markswift-themes" content="light,dark">
<title>font-variant-numeric</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: right; }
td:first-child { text-align: left; }
.tab td { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="proportional">
  <p class="cap">proportional digits (default)</p>
  <table><tr><td>Total</td><td>1,111.11</td></tr><tr><td>Fees</td><td>8,888.88</td></tr><tr><td>Net</td><td>4,040.40</td></tr></table>
</section>
<section class="v" id="tabular">
  <p class="cap">font-variant-numeric: tabular-nums</p>
  <table class="tab"><tr><td>Total</td><td>1,111.11</td></tr><tr><td>Fees</td><td>8,888.88</td></tr><tr><td>Net</td><td>4,040.40</td></tr></table>
</section>
</main>
</body>
</html>
