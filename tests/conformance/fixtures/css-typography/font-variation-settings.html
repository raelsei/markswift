<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="font-variation-settings; font-stretch; font-optical-sizing: none">
<meta name="markswift-themes" content="light,dark">
<title>font-variation-settings</title>
<style>
@font-face{font-family:LocalGeist;src:url('../assets/geist-latin-wght-normal.woff2') format('woff2');font-style:normal;font-weight:100 900}
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
p.s { margin: 0 0 8px; }
p.s:last-child { margin-bottom: 0; }
p.s { font-size: 18px; line-height: 24px; }
.g { font-family: LocalGeist, system-ui; }
.w7 { font-weight: 700; }
.v650 { font-variation-settings: "wght" 650; }
.v300 { font-variation-settings: "wght" 300; }
.v900w80 { font-variation-settings: "wght" 900, "wdth" 80; }
.noopsz { font-optical-sizing: none; }
.sys { font-family: system-ui; }
.st75 { font-stretch: 75%; }
.st125 { font-stretch: 125%; }
.wd75 { font-variation-settings: "wdth" 75; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="geist">
  <p class="cap">Variable Geist: wght axis from font-variation-settings</p>
  <p class="s g">Geist at its font-weight</p>
  <p class="s g v650">Geist wght 650</p>
  <p class="s g w7 v300">Geist 700 with wght 300</p>
  <p class="s g v900w80">Geist wght 900, wdth 80</p>
  <p class="s g noopsz">Geist without optical sizing</p>
</section>
<section class="v" id="system">
  <p class="cap">system-ui widths</p>
  <p class="s sys st75">Condensed width probe</p>
  <p class="s sys st125">Expanded width probe</p>
  <p class="s sys wd75">Variation wdth 75 probe</p>
</section>
</main>
</body>
</html>
