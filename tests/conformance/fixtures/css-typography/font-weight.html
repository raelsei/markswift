<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="font-weight">
<meta name="markswift-themes" content="light,dark">
<title>font-weight</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
p.s { margin: 0 0 8px; }
p.s:last-child { margin-bottom: 0; }
.w3 { font-weight: 300; } .w4 { font-weight: 400; } .w5 { font-weight: 500; } .w6 { font-weight: 600; } .w7 { font-weight: 700; } .w8 { font-weight: 800; } .w9 { font-weight: 900; }
p.s { font-size: 18px; line-height: 24px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="weights">
  <p class="cap">300 → 900 in steps</p>
  <p class="s w3">300 Light weight text</p>
  <p class="s w4">400 Regular weight text</p>
  <p class="s w5">500 Medium weight text</p>
  <p class="s w6">600 Semibold weight text</p>
  <p class="s w7">700 Bold weight text</p>
  <p class="s w8">800 Extrabold weight text</p>
  <p class="s w9">900 Black weight text</p>
</section>
</main>
</body>
</html>
