<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="letter-spacing; word-spacing">
<meta name="markswift-themes" content="light,dark">
<title>letter-spacing</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
p.s { margin: 0 0 8px; }
p.s:last-child { margin-bottom: 0; }
.tight { letter-spacing: -0.5px; }
.wide { letter-spacing: 2px; }
.caps { letter-spacing: 0.12em; text-transform: uppercase; font-size: 12px; font-weight: 600; }
.words { word-spacing: 8px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="tracking">
  <p class="cap">letter-spacing -0.5px / 0 / 2px / 0.12em caps</p>
  <p class="s tight">Tight tracking headline</p>
  <p class="s">Default tracking headline</p>
  <p class="s wide">Wide tracking headline</p>
  <p class="s caps">Section label</p>
</section>
<section class="v" id="word-spacing"><p class="cap">word-spacing: 8px</p><p class="s words">Words spread wider apart here</p></section>
</main>
</body>
</html>
