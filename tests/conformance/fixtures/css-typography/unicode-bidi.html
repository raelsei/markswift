<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="unicode-bidi; bdo">
<meta name="markswift-themes" content="light,dark">
<title>unicode-bidi</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0e13; --fg: #e5e7eb; --muted: #9ca3af; --card: #161b24; --line: #2a3140; --accent: #60a5fa; --accent-fg: #0b0e13; --soft: #1e3a8a; } }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
p.s { margin: 0 0 8px; }
p.s:last-child { margin-bottom: 0; }
p.s { font-size: 18px; line-height: 24px; }
.ov { unicode-bidi: bidi-override; direction: rtl; }
.io { unicode-bidi: isolate-override; direction: rtl; }
.em { unicode-bidi: embed; direction: rtl; }
.is { unicode-bidi: isolate; direction: rtl; }
.pt { unicode-bidi: plaintext; }
.hostov { unicode-bidi: bidi-override; direction: rtl; }
.reset { unicode-bidi: normal; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="bidi">
  <p class="cap">unicode-bidi on inline spans, a host and a reset bdo</p>
  <p class="s">Normal text with <span class="ov">reversed run</span> after.</p>
  <p class="s">Isolated <span class="io">override run</span> here.</p>
  <p class="s">Embed <span class="em">שלום 123!</span> done.</p>
  <p class="s">Isolate <span class="is">עברית!</span> done.</p>
  <p class="s">Plain <span class="pt">שלום world</span> text.</p>
  <p class="s hostov">Whole paragraph overridden</p>
  <p class="s">Reset <bdo dir="rtl" class="reset">not reversed</bdo> bdo.</p>
</section>
</main>
</body>
</html>
