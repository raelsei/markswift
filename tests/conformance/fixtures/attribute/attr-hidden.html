<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="@hidden">
<title>attr-hidden</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.row { display: flex; gap: 8px; }
.b { background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="hidden-inline"><p class="cap">flex row: second chip has the hidden attribute</p><div class="row"><span class="b">One</span><span class="b" hidden>Hidden</span><span class="b">Three</span></div></section>
<section class="v" id="hidden-block"><p class="cap">a hidden card between two cards</p><div class="card">Card A</div><div class="card" hidden>Hidden card</div><div class="card">Card B</div></section>
</main>
</body>
</html>
