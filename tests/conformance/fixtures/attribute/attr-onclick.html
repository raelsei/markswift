<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="markswift-rows" content="@onclick; button; @role">
<title>attr-onclick</title>
<style>
:root { --bg: #f4f6fa; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #d9dee7; --accent: #2563eb; --accent-fg: #ffffff; --soft: #dbeafe; }
html, body { margin: 0; }
body { background: var(--bg); }
main[data-markswift-root] { box-sizing: border-box; width: 393px; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui; font-size: 15px; line-height: 20px; }
.cap { margin: 0 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.v { margin: 0 0 16px; }
.v:last-child { margin-bottom: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
button, .fake { font: inherit; font-size: 14px; line-height: 20px; border-radius: 10px; padding: 8px 16px; border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 600; cursor: pointer; }
.fake { display: inline-block; background: var(--soft); color: var(--fg); }
</style>
</head>
<body>
<main data-markswift-root>
<section class="v" id="handlers">
  <p class="cap">buttons with inline onclick handlers and a div role=button with onclick</p>
  <div class="row">
    <button type="button" onclick="save()">Save</button>
    <button type="button" onclick="cancel()">Cancel</button>
    <div class="fake" role="button" tabindex="0" onclick="openMenu()">Menu</div>
  </div>
</section>
</main>
</body>
</html>
