<script>
// Fixture stand-in for Radix portals. data-fixture-opens="<layer element id>" on a trigger; [data-fixture-close]
// closes; [data-fixture-scrim] or (non-modal) any outside click closes; Escape closes; hover triggers open after 300 ms.
// [data-fixture-popper] content is placed like Radix's popper: fixed 0,0, translated under the trigger, centred.
const root = document.querySelector("[data-markswift-root]");
let current;
// Radix sets data-state on the trigger and on each portal part, and keeps the parts mounted until their exit
// animations end (Presence).
const set = (t, el, open) => {
  for (const x of [t, el, ...el.querySelectorAll("[data-state]")]) {
    x.setAttribute("data-state", open ? "open" : "closed");
    x.toggleAttribute("data-open", open);
    x.toggleAttribute("data-closed", !open);
  }
  t.setAttribute("aria-expanded", String(open));
  const exits = open ? [] : el.getAnimations({ subtree: true });
  const hide = () => (el.hidden = current?.el !== el);
  if (exits.length) Promise.all(exits.map((a) => a.finished.catch(() => {}))).then(hide);
  else el.hidden = !open;
  if (open && el.dataset.fixturePopper !== undefined) {
    const r = t.getBoundingClientRect();
    const x = Math.min(Math.max(r.left + (r.width - el.offsetWidth) / 2, 0), innerWidth - el.offsetWidth);
    el.style.transform = `translate(${Math.round(x)}px, ${Math.round(r.bottom + 4)}px)`;
  }
  if (el.dataset.fixtureModal !== undefined) root.toggleAttribute("aria-hidden", open);
  current = open ? { t, el } : undefined;
  if (open) el.querySelector("input, button")?.focus();
};
const close = () => current && set(current.t, current.el, false);
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-fixture-opens]:not([data-fixture-hover])");
  if (t) return set(t, document.getElementById(t.dataset.fixtureOpens), true);
  if (!current) return;
  if (e.target.closest("[data-fixture-close], [data-fixture-scrim]")) return close();
  if (current.el.dataset.fixtureModal === undefined && !current.el.contains(e.target)) close();
});
document.addEventListener("keydown", (e) => e.key === "Escape" && close());
for (const t of document.querySelectorAll("[data-fixture-hover]"))
  t.addEventListener("mouseenter", () => setTimeout(() => set(t, document.getElementById(t.dataset.fixtureOpens), true), 300));
</script>
