name: Diag table
on: pull_request
jobs:
  diag:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      MARKSWIFT_SIMULATOR: iPhone 17
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install fonttools==4.60.2 brotli==1.2.0
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/playwright-core install --no-shell chromium
      - name: Render table cases on iOS
        run: |
          for c in table table-separated shadcn-table; do
            bun run pilot --renderer ios --all --only "$c" --out "$RUNNER_TEMP/t/$c" || true
          done
      - run: bun run _diag-table.ts "$RUNNER_TEMP"/t/*
      - if: always()
        run: tar -czf "$RUNNER_TEMP/diag-table.tgz" -C "$RUNNER_TEMP" t
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diag-table
          path: ${{ runner.temp }}/diag-table.tgz
          retention-days: 3
