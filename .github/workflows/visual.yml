name: Visual

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      renderer: { type: choice, options: [mac, ios], default: mac }
      scope: { type: choice, options: [pilot, all], default: pilot }
      rebaseline: { type: boolean, default: false }

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    if: ${{ (inputs.scope || ((github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')) && 'all') || 'pilot') == 'pilot' }}
    runs-on: xcode-27
    # macOS all scope (1419 captures): 1h41m batched (#36), 3h08m with one swiftc per capture. iOS all scope (1304
    # captures): 2h35m on 2026-10-27, including the post-boot quiet wait (#34).
    timeout-minutes: 240
    env:
      RENDERER: ${{ inputs.renderer || (startsWith(github.ref, 'refs/tags/v') && 'ios') || 'mac' }}
      SCOPE: ${{ inputs.scope || ((github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')) && 'all') || 'pilot' }}
      MARKSWIFT_SIMULATOR: iPhone 17
      # The baselines' toolchain (provenance); the image's default Xcode is older.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/playwright-core install --no-shell chromium
      - name: Toolchain
        run: |
          sw_vers -productVersion
          xcodebuild -version
          xcode-select -p
          bun --version
          ./node_modules/.bin/playwright-core --version
          xcrun simctl list runtimes available
          xcrun simctl list devices available | grep -E "iPhone 17( |$)" || echo "no iPhone 17 device (plan 020 creates it)"
      - name: Render
        run: bun run pilot --renderer "$RENDERER" $([ "$SCOPE" = all ] && echo --all) $([ "$RENDERER" = mac ] && echo --reflow) --out "$RUNNER_TEMP/visual"
      - name: Gate
        if: ${{ !inputs.rebaseline }}
        run: |
          baseline="tests/conformance/baselines/visual-$SCOPE-$RENDERER.json"
          if [ ! -f "$baseline" ]; then
            echo "::error::$baseline is not tracked yet. Dispatch Visual with renderer=$RENDERER scope=$SCOPE rebaseline=true, review the candidate artifact and commit it."
            exit 1
          fi
          bun run quality "$baseline" "$RUNNER_TEMP/visual" "tests/conformance/visual-policy-$RENDERER.json"
      - name: Candidate baseline (review, then commit by hand)
        if: ${{ inputs.rebaseline }}
        run: bun run quality --write-baseline "$RUNNER_TEMP/visual" "$RUNNER_TEMP/visual-$SCOPE-$RENDERER.json"
      # Capture keys contain ':' (`@t:250`, `@open:<layer>`), which upload-artifact refuses; ship the run as one archive.
      - name: Archive the run
        if: always()
        run: tar -czf "$RUNNER_TEMP/visual-$SCOPE-$RENDERER.tgz" -C "$RUNNER_TEMP" visual
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-${{ env.SCOPE }}-${{ env.RENDERER }}
          path: |
            ${{ runner.temp }}/visual-${{ env.SCOPE }}-${{ env.RENDERER }}.tgz
            ${{ runner.temp }}/visual-${{ env.SCOPE }}-${{ env.RENDERER }}.json
          if-no-files-found: warn
          retention-days: 30

  visual-shard:
    name: Visual shard ${{ matrix.shard }}/4
    if: ${{ (inputs.scope || ((github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')) && 'all') || 'pilot') == 'all' }}
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      RENDERER: ${{ inputs.renderer || (startsWith(github.ref, 'refs/tags/v') && 'ios') || 'mac' }}
      SCOPE: all
      MARKSWIFT_SIMULATOR: iPhone 17
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/playwright-core install --no-shell chromium
      - name: Toolchain
        run: |
          sw_vers -productVersion
          xcodebuild -version
          xcode-select -p
          bun --version
          ./node_modules/.bin/playwright-core --version
          xcrun simctl list runtimes available
          xcrun simctl list devices available | grep -E "iPhone 17( |$)" || echo "no iPhone 17 device (plan 020 creates it)"
      - name: Render
        run: bun run pilot --renderer "$RENDERER" --all $([ "$RENDERER" = mac ] && echo --reflow) --shard "${{ matrix.shard }}/4" --out "$RUNNER_TEMP/visual-shard-${{ matrix.shard }}"
      - name: Archive shard
        if: always()
        run: tar -czf "$RUNNER_TEMP/visual-shard-${{ matrix.shard }}.tgz" -C "$RUNNER_TEMP" "visual-shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/visual-shard-${{ matrix.shard }}.tgz
          if-no-files-found: warn
          retention-days: 7

  visual-merge:
    name: Visual merge & gate
    needs: visual-shard
    if: always() && !cancelled() && needs.visual-shard.result == 'success'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      RENDERER: ${{ inputs.renderer || (startsWith(github.ref, 'refs/tags/v') && 'ios') || 'mac' }}
      SCOPE: all
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          pattern: visual-shard-*
          path: ${{ runner.temp }}/shards
      - name: Unpack shards
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          for f in "$RUNNER_TEMP"/shards/visual-shard-*/*.tgz; do
            tar -xzf "$f" -C "$RUNNER_TEMP/unpacked"
          done
      - name: Merge shards
        run: bun run quality --merge "$RUNNER_TEMP/visual" "$RUNNER_TEMP"/unpacked/visual-shard-*
      - name: Gate
        if: ${{ !inputs.rebaseline }}
        run: |
          baseline="tests/conformance/baselines/visual-$SCOPE-$RENDERER.json"
          if [ ! -f "$baseline" ]; then
            echo "::error::$baseline is not tracked yet. Dispatch Visual with renderer=$RENDERER scope=$SCOPE rebaseline=true, review the candidate artifact and commit it."
            exit 1
          fi
          bun run quality "$baseline" "$RUNNER_TEMP/visual" "tests/conformance/visual-policy-$RENDERER.json"
      - name: Candidate baseline (review, then commit by hand)
        if: ${{ inputs.rebaseline }}
        run: bun run quality --write-baseline "$RUNNER_TEMP/visual" "$RUNNER_TEMP/visual-$SCOPE-$RENDERER.json"
      - name: Archive the run
        if: always()
        run: tar -czf "$RUNNER_TEMP/visual-$SCOPE-$RENDERER.tgz" -C "$RUNNER_TEMP" visual
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-${{ env.SCOPE }}-${{ env.RENDERER }}
          path: |
            ${{ runner.temp }}/visual-${{ env.SCOPE }}-${{ env.RENDERER }}.tgz
            ${{ runner.temp }}/visual-${{ env.SCOPE }}-${{ env.RENDERER }}.json
          if-no-files-found: warn
          retention-days: 30

  breakpoints-ios:
    name: iPad breakpoint reflow
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      MARKSWIFT_SIMULATOR: iPhone 17
      MARKSWIFT_SIMULATOR_IPAD: iPad Pro 13-inch (M5)
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/playwright-core install --no-shell chromium
      # The device type has a memory suffix that cannot be derived from the display name.
      - name: Ensure the iPad simulator exists
        run: |
          bun -e "
          const { execFileSync } = require('child_process');
          function simctl(...args) { return execFileSync('xcrun', ['simctl', ...args], { encoding: 'utf-8' }); }
          const name = process.env.MARKSWIFT_SIMULATOR_IPAD;
          const devices = JSON.parse(simctl('list', 'devices', 'available', '-j')).devices;
          if (!Object.values(devices).flat().some(d => d.name === name && d.isAvailable)) {
            const runtimes = JSON.parse(simctl('list', 'runtimes', 'available', '-j')).runtimes;
            const ios = runtimes.filter(r => r.platform === 'iOS');
            const runtime = ios.sort((a, b) => b.version.localeCompare(a.version, undefined, { numeric: true }))[0].identifier;
            console.log(simctl('create', name, 'com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-12GB', runtime));
          }
          "
      - name: Render iPhone and iPad breakpoint captures
        run: bun run pilot --renderer ios --all --reflow --group breakpoints --out "$RUNNER_TEMP/breakpoints-ios"
      - name: Gate breakpoint reflow
        if: ${{ !inputs.rebaseline }}
        run: bun run quality tests/conformance/baselines/visual-breakpoints-ios.json "$RUNNER_TEMP/breakpoints-ios" tests/conformance/visual-policy-ios.json
      - name: Candidate baseline (review, then commit by hand)
        if: ${{ inputs.rebaseline }}
        run: bun run quality --write-baseline "$RUNNER_TEMP/breakpoints-ios" "$RUNNER_TEMP/visual-breakpoints-ios.json"
      - name: Archive the run
        if: always()
        run: tar -czf "$RUNNER_TEMP/visual-breakpoints-ios.tgz" -C "$RUNNER_TEMP" breakpoints-ios
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-breakpoints-ios
          path: |
            ${{ runner.temp }}/visual-breakpoints-ios.tgz
            ${{ runner.temp }}/visual-breakpoints-ios.json
          if-no-files-found: warn
          retention-days: 30
