name: Visual

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      renderer: { type: choice, options: [mac, ios], default: mac }
      scope: { type: choice, options: [pilot, all], default: pilot }
      rebaseline: { type: boolean, default: false }

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: xcode-27
    # iOS all scope (924 captures): 40 min measured 2026-10-11 (plan 021). macOS all scope (1419 captures, one swiftc per
    # capture): 2h57m–3h+ on nightly runs in Oct 2026 (#34), which overran the former 180.
    timeout-minutes: 240
    env:
      RENDERER: ${{ inputs.renderer || (startsWith(github.ref, 'refs/tags/v') && 'ios') || 'mac' }}
      SCOPE: ${{ inputs.scope || ((github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')) && 'all') || 'pilot' }}
      MARKSWIFT_SIMULATOR: iPhone 17
      # The baselines' toolchain (provenance); the image's default Xcode is older.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install fonttools==4.60.2 brotli==1.2.0
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/playwright-core install --no-shell chromium
      - name: Toolchain
        run: |
          sw_vers -productVersion
          xcodebuild -version
          xcode-select -p
          bun --version
          ./node_modules/.bin/playwright-core --version
          xcrun simctl list runtimes available
          xcrun simctl list devices available | grep -E "iPhone 17( |$)" || echo "no iPhone 17 device (plan 020 creates it)"
      - name: Render
        run: bun run pilot --renderer "$RENDERER" $([ "$SCOPE" = all ] && echo --all) $([ "$RENDERER" = mac ] && echo --reflow) --out "$RUNNER_TEMP/visual"
      - name: Gate
        if: ${{ !inputs.rebaseline }}
        run: |
          baseline="tests/conformance/baselines/visual-$SCOPE-$RENDERER.json"
          if [ ! -f "$baseline" ]; then
            echo "::error::$baseline is not tracked yet. Dispatch Visual with renderer=$RENDERER scope=$SCOPE rebaseline=true, review the candidate artifact and commit it."
            exit 1
          fi
          bun run quality "$baseline" "$RUNNER_TEMP/visual" "tests/conformance/visual-policy-$RENDERER.json"
      - name: Candidate baseline (review, then commit by hand)
        if: ${{ inputs.rebaseline }}
        run: bun run quality --write-baseline "$RUNNER_TEMP/visual" "$RUNNER_TEMP/visual-$SCOPE-$RENDERER.json"
      # Capture keys contain ':' (`@t:250`, `@open:<layer>`), which upload-artifact refuses; ship the run as one archive.
      - name: Archive the run
        if: always()
        run: tar -czf "$RUNNER_TEMP/visual-$SCOPE-$RENDERER.tgz" -C "$RUNNER_TEMP" visual
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-${{ env.SCOPE }}-${{ env.RENDERER }}
          path: |
            ${{ runner.temp }}/visual-${{ env.SCOPE }}-${{ env.RENDERER }}.tgz
            ${{ runner.temp }}/visual-${{ env.SCOPE }}-${{ env.RENDERER }}.json
          if-no-files-found: warn
          retention-days: 30

  breakpoints-ios:
    name: iPad breakpoint reflow
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      MARKSWIFT_SIMULATOR: iPhone 17
      MARKSWIFT_SIMULATOR_IPAD: iPad Pro 13-inch (M5)
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install fonttools==4.60.2 brotli==1.2.0
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/playwright-core install --no-shell chromium
      # The device type has a memory suffix that cannot be derived from the display name.
      - name: Ensure the iPad simulator exists
        run: |
          python - <<'PY'
          import json, os, subprocess
          def simctl(*args):
              return subprocess.check_output(["xcrun", "simctl", *args], text=True)
          name = os.environ["MARKSWIFT_SIMULATOR_IPAD"]
          devices = json.loads(simctl("list", "devices", "available", "-j"))["devices"]
          if not any(d["name"] == name and d.get("isAvailable") for group in devices.values() for d in group):
              runtimes = json.loads(simctl("list", "runtimes", "available", "-j"))["runtimes"]
              ios = [r for r in runtimes if r["platform"] == "iOS"]
              runtime = max(ios, key=lambda r: tuple(map(int, r["version"].split("."))))["identifier"]
              print(simctl("create", name, "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-12GB", runtime))
          PY
      - name: Render iPhone and iPad breakpoint captures
        run: bun run pilot --renderer ios --all --reflow --group breakpoints --out "$RUNNER_TEMP/breakpoints-ios"
      - name: Gate breakpoint reflow
        if: ${{ !inputs.rebaseline }}
        run: bun run quality tests/conformance/baselines/visual-breakpoints-ios.json "$RUNNER_TEMP/breakpoints-ios" tests/conformance/visual-policy-ios.json
      - name: Candidate baseline (review, then commit by hand)
        if: ${{ inputs.rebaseline }}
        run: bun run quality --write-baseline "$RUNNER_TEMP/breakpoints-ios" "$RUNNER_TEMP/visual-breakpoints-ios.json"
      - name: Archive the run
        if: always()
        run: tar -czf "$RUNNER_TEMP/visual-breakpoints-ios.tgz" -C "$RUNNER_TEMP" breakpoints-ios
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-breakpoints-ios
          path: |
            ${{ runner.temp }}/visual-breakpoints-ios.tgz
            ${{ runner.temp }}/visual-breakpoints-ios.json
          if-no-files-found: warn
          retention-days: 30
