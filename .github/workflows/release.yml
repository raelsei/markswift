name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 60
    # Operator configures required reviewers on this environment (approval gate) and the NPM_TOKEN secret.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags for the LayoutDoc freeze test (tests/architecture/layout-doc.test.ts)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install fonttools==4.60.2 brotli==1.2.0
      - name: Tag matches package.json version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: tools/verify/npm-smoke.sh
      - name: Publish with provenance
        run: |
          npm publish --provenance --access public --tag "$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
