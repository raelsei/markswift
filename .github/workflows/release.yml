name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 60
    # Required reviewers on this environment are the approval gate. npm trusts this workflow and environment
    # (trusted publishing over OIDC, `id-token: write`), so no npm token is stored.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags for the LayoutDoc freeze test (tests/architecture/layout-doc.test.ts)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install fonttools==4.60.2 brotli==1.2.0
      - name: Tag matches package.json version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: tools/verify/npm-smoke.sh
      - name: Publish with provenance (trusted publishing)
        run: |
          npm install -g npm@^11.15
          npm publish --provenance --access public --tag "$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")"

      - name: Verify the published version and distribution tag
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")"
          # Registry metadata and provenance processing can take a few minutes to become visible after publish.
          for attempt in {1..60}; do
            published="$(npm view "markswift@$version" version 2>/dev/null || true)"
            tagged="$(npm view "markswift" "dist-tags.$tag" 2>/dev/null || true)"
            if [ "$published" = "$version" ] && [ "$tagged" = "$version" ]; then
              echo "Verified markswift@$published ($tag=$tagged) on attempt $attempt"
              break
            fi
            echo "Attempt $attempt/60: waiting for markswift@$version (published='${published:-none}', $tag='${tagged:-none}')..."
            sleep 5
          done
          test "$published" = "$version"
          test "$tagged" = "$version"
      - name: Smoke test the registry package in an empty directory
        run: |
          version="$(node -p "require('./package.json').version")"
          smoke_dir="$(mktemp -d "$RUNNER_TEMP/markswift-registry.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          cd "$smoke_dir"
          actual="$(npx --yes --package="markswift@$version" markswift --version)"
          test "$actual" = "$version"
