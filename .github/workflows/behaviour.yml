name: Behaviour

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: behaviour-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behaviour:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      MARKSWIFT_SIMULATOR: iPhone 17
      # Same toolchain as the visual baselines; the image's default Xcode is older.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install fonttools==4.60.2 brotli==1.2.0
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/playwright-core install --no-shell chromium
      - name: Toolchain
        run: sw_vers -productVersion && xcodebuild -version && xcrun simctl list runtimes
      - name: iOS behaviour
        run: bun run test:ios-behaviour --out "$RUNNER_TEMP/behaviour"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: behaviour
          path: ${{ runner.temp }}/behaviour/*.json
          retention-days: 30
