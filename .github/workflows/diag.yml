name: Diag
on: pull_request
jobs:
  diag:
    runs-on: xcode-27
    timeout-minutes: 80
    env:
      MARKSWIFT_SIMULATOR_IPAD: iPad Pro 13-inch (M5)
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/playwright-core install --no-shell chromium
      - name: Ensure the iPad simulator exists
        run: |
          xcrun simctl list devices available | grep -q "iPad Pro 13-inch (M5)" || xcrun simctl create "iPad Pro 13-inch (M5)" com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-12GB "$(xcrun simctl list runtimes available -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS"]; print(r[-1]["identifier"])')"
      - run: bun run _diag.ts
