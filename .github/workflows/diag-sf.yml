name: Diag SF
on: pull_request
jobs:
  diag:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      MARKSWIFT_SIMULATOR: iPhone 17
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run _probe-sf.ts
