name: Diag SF
on: pull_request
jobs:
  diag:
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      MARKSWIFT_SIMULATOR: iPhone 17
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install fonttools==4.60.2 brotli==1.2.0
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/playwright-core install --no-shell chromium
      - name: Render animation-name on iOS
        run: |
          : > /tmp/markswift-greedy.txt
          bun run pilot --renderer ios --all --only animation-name --out "$RUNNER_TEMP/an" || true
          cat /tmp/markswift-greedy.txt | sort -u
          for d in "$RUNNER_TEMP"/an/animation-name-*-app; do k=$(basename "$d"); echo "$k $(jq .ssim "$d/compare.json") base $(jq --arg k "$k" '.[$k].ssim' tests/conformance/baselines/visual-all-ios.json)"; done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: an
          path: ${{ runner.temp }}/an
          retention-days: 3
