<main data-markswift-root class="selection-page">
  <h1>Selection lists</h1>
  <label for="single-list">Workspace region</label>
  <select id="single-list" size="3"><option value="eu" selected>Europe</option><option value="na">North America</option><option value="ap" disabled>Asia Pacific</option></select>
  <label for="multiple-list">Build targets</label>
  <select id="multiple-list" multiple size="5"><optgroup label="Runtimes"><option value="bun" selected>Bun</option><option value="node" selected>Node</option></optgroup><option value="swift">SwiftUI</option><option value="legacy" disabled>Legacy</option></select>
</main>
