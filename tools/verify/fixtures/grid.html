<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
</head>
<body>
  <main data-markswift-root class="grid-page">
    <h1>Workspace overview</h1>
    <p class="intro">Four equal tracks, one shared rhythm.</p>
    <section id="activity-grid" class="tiles" aria-label="Workspace activity">
      <article class="tile planning">
        <small>PLANNING</small>
        <h2>12 tasks</h2>
        <p>Ready to build</p>
      </article>
      <article class="tile progress align-right">
        <small>PROGRESS</small>
        <h2>8 shipped</h2>
        <p>This week</p>
      </article>
      <article class="tile review align-center">
        <small>REVIEW</small>
        <h2>3 drafts</h2>
        <p>Awaiting feedback</p>
      </article>
      <article class="tile team">
        <small>TEAM</small>
        <h2>5 people</h2>
        <p>Working together</p>
      </article>
    </section>
  </main>
</body>
</html>
