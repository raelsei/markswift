<main data-markswift-root class="table-page">
  <h1>Release matrix</h1>
  <table id="span-table">
    <caption id="span-caption">Grouped release checks</caption>
    <colgroup><col class="first-column"><col class="fixed-column"><col></colgroup>
    <thead><tr><th>Scope</th><th colspan="2">Checks</th></tr></thead>
    <tbody>
      <tr><th rowspan="2" class="blue">Core</th><td class="amber">CLI</td><td class="green">Passed</td></tr>
      <tr><td colspan="2" class="green">Bun and Node passed</td></tr>
      <tr><th class="blue">Preview</th><td class="amber">Web</td><td class="green">Passed</td></tr>
    </tbody>
  </table>
</main>
