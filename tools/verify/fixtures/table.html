<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
</head>
<body>
  <main data-markswift-root class="table-page">
    <h1 id="table-title">Release checklist</h1>
    <table id="release-table" aria-labelledby="table-title">
      <caption id="release-caption" class="caption">Three equal columns track the next release.</caption>
      <thead>
        <tr><th scope="col">Feature</th><th scope="col">Owner</th><th scope="col">Status</th></tr>
      </thead>
      <tbody>
        <tr><td class="area">Layout</td><td class="owner">Mira</td><td class="state">Ready</td></tr>
        <tr><td class="area">Images</td><td class="owner">Eren</td><td class="state">Review</td></tr>
        <tr><td class="area">Package</td><td class="owner">Ada</td><td class="state">Passed</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
