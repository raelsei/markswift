<form data-markswift-root class="form-card">
  <h1>Create a workspace</h1>
  <div class="field"><label for="workspace">Workspace name</label><input id="workspace" value="Studio North"></div>
  <div class="field"><label for="token">Access token</label><input id="token" type="password" value="secret"></div>
  <div class="field"><label for="region">Region</label><select id="region"><option>Europe</option><option>North America</option></select></div>
  <div class="field"><label for="notes">Project notes</label><textarea id="notes" readonly>Design tools for a calmer day.</textarea></div>
  <div class="choice"><input id="updates" type="checkbox" checked><label for="updates">Receive product updates</label></div>
  <div class="choice"><input id="plan" type="radio" checked><label for="plan">Personal workspace</label></div>
  <div class="field"><label for="progress">Setup progress</label><progress id="progress" max="100" value="60"></progress></div>
  <input class="submit" type="submit" value="Create workspace">
</form>
